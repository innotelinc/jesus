; A carrier-shaped PJSIP peer, for proving the gateway's SDES-SRTP against the
; same stack voip.ms runs (Asterisk + res_srtp) instead of against itself.
;
;   docker run -d --name srtp-peer --network cantus-estate_default \
;     -v .../asterisk-srtp:/etc/asterisk:ro andrius/asterisk
;
; `media_encryption=sdes` with `media_encryption_optimistic=no` is the important
; pair: the optimistic flag would let a plain offer through, which is exactly
; the behaviour this test has to rule out.
;
; The AOR is named after the registering user because that is how Asterisk finds
; it: the To user of a REGISTER is the AOR, and a mismatch is answered with
; `404 Not Found` — which reads like a routing problem rather than a name.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5080

[srtp-test]
type=auth
auth_type=userpass
username=srtp-test
password=srtp-test-secret

[test]
type=endpoint
context=from-test
disallow=all
allow=ulaw
auth=srtp-test
aors=srtp-test
media_encryption=sdes
media_encryption_optimistic=no

[srtp-test]
type=aor
max_contacts=4

; Matched by address too, because the gateway registers from the Docker network
; and an endpoint that only matches by username leaves the first REGISTER with
; "No matching endpoint found" — a 401 that looks like a wrong password.
[test-identify]
type=identify
endpoint=test
match=172.16.0.0/12
