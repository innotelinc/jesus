; Whoever the gateway dials is answered and echoed back.
;
; Echo matters: it means the audio path is measurable in both directions at
; once. A tone we encrypt and send comes back decrypted; if either half of the
; SRTP pair is wrong the gateway hears nothing and the call reports no audio.

[general]
static=yes
writeprotect=no

[from-test]
exten => _X.,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()
