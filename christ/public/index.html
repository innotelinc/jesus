<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CHRIST — one AI voice system</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d12;
        --panel: #12151d;
        --panel-2: #171b25;
        --line: #232937;
        --ink: #e7eaf3;
        --muted: #8b93a7;
        --accent: #6366f1;
        --accent-soft: #6366f122;
        --up: #22c55e;
        --warn: #f59e0b;
        --off: #5b6478;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% -10%, #1b2040 0%, var(--bg) 60%);
        color: var(--ink);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
      }
      header {
        display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
        padding: 28px 32px 8px; max-width: 1280px; margin: 0 auto;
      }
      h1 { font-size: 22px; margin: 0; letter-spacing: 0.14em; font-weight: 700; }
      h1 span { color: var(--accent); }
      .tagline { color: var(--muted); font-size: 14px; }
      .spacer { flex: 1; }
      .live { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
      .dot.on { background: var(--up); box-shadow: 0 0 0 4px #22c55e22; }
      .dot.bad { background: #ef4444; box-shadow: 0 0 0 4px #ef444422; }

      main { max-width: 1280px; margin: 0 auto; padding: 8px 32px 56px; }

      /* the call, as one line of topology */
      .call {
        display: flex; flex-wrap: wrap; align-items: stretch; gap: 0;
        border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
        background: linear-gradient(180deg, var(--panel-2), var(--panel)); margin: 20px 0 28px;
      }
      .hop { padding: 16px 18px; min-width: 190px; flex: 1; border-right: 1px solid var(--line); }
      .hop:last-child { border-right: 0; }
      .hop b { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
      .hop .v { font-family: var(--mono); font-size: 19px; margin-top: 6px; }
      .hop .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .hop.accent { background: var(--accent-soft); }

      section { margin: 0 0 30px; }
      section > h2 {
        font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
        margin: 0 0 4px; font-weight: 700;
      }
      section > p.blurb { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
        display: flex; flex-direction: column; gap: 8px; min-height: 132px;
      }
      .card:hover { border-color: #2f374b; }
      .card .top { display: flex; align-items: baseline; gap: 8px; }
      .card .name { font-weight: 650; font-size: 15px; }
      .card .iface { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
      .card .role { color: #b9c0d2; font-size: 13px; flex: 1; }
      .card .foot { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
      .pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
      .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--off); }
      .pill.up { color: #9ae6b4; border-color: #22c55e44; background: #22c55e14; }
      .pill.up i { background: var(--up); }
      .pill.missing { color: var(--off); }
      .pill.bad { color: #fca5a5; border-color: #ef444444; background: #ef444414; }
      .pill.bad i { background: #ef4444; }
      .pill.warn { color: #fcd34d; border-color: #f59e0b44; background: #f59e0b14; }
      .pill.warn i { background: var(--warn); }
      a.open { color: var(--accent); text-decoration: none; margin-left: auto; }
      a.open:hover { text-decoration: underline; }
      footer { color: var(--muted); font-family: var(--mono); font-size: 11px; padding: 0 32px 40px; max-width: 1280px; margin: 0 auto; }
      .empty { color: var(--muted); font-size: 13px; }
    </style>
  </head>
  <body>
    <header>
      <h1>CHRIST<span>.</span></h1>
      <div class="tagline" id="tagline">one AI voice system, assembled from every project in the tree</div>
      <div class="spacer"></div>
      <div class="live"><span class="dot" id="dot"></span><span id="stamp">connecting…</span></div>
    </header>

    <main>
      <div class="call" id="call"></div>
      <div id="layers"></div>
    </main>

    <footer id="footer"></footer>

    <script>
      const pill = (state) => {
        const cls = state === 'up' ? 'up' : state === 'not configured' ? 'missing' : /^HTTP [23]/.test(state) ? 'warn' : 'bad';
        return `<span class="pill ${cls}"><i></i>${state}</span>`;
      };

      function renderCall(b) {
        const w = b.wiring || {};
        const sw = b.switch || {};
        const office = w.officeHours ? `${w.officeHours.time} · ${(w.officeHours.weekday || []).join(',')}` : 'always';
        const hops = [
          { k: 'carrier', v: w.did || '—', s: w.trunk ? `trunk ${w.trunk}` : 'no trunk' },
          { k: 'in hours', v: w.officeHours?.line ? `line ${w.officeHours.line}` : '—', s: office },
          { k: 'after hours', v: w.afterHours?.agent ? `agent ${w.afterHours.agent}` : '—', s: w.agentApp ? `ari ${w.agentApp}` : 'no agent app' },
          { k: 'switch', v: sw.reachable ? `${sw.routeCount} routes` : 'down', s: sw.reachable ? `${sw.calls?.active ?? 0} active · ${sw.id || ''}` : sw.error || 'unreachable', accent: true },
        ];
        document.getElementById('call').innerHTML = hops
          .map((hop) => `<div class="hop${hop.accent ? ' accent' : ''}"><b>${hop.k}</b><div class="v">${hop.v}</div><div class="s">${hop.s}</div></div>`)
          .join('');
      }

      function renderLayers(b) {
        document.getElementById('layers').innerHTML = (b.layers || [])
          .map((layer) => {
            const cards = layer.projects
              .map((project) => {
                const canOpen = project.url && project.state === 'up';
                return `<article class="card">
                  <div class="top"><span class="name">${project.name}</span><span class="iface">${project.interface || ''}</span></div>
                  <div class="role">${project.role}</div>
                  <div class="foot">${pill(project.state)}
                    <span>${project.url ? project.url.replace(/^https?:\/\//, '') : project.dir}</span>
                    ${canOpen ? `<a class="open" href="/p/${project.id}/" target="_blank" rel="noopener">open ↗</a>` : ''}
                  </div>
                </article>`;
              })
              .join('');
            return `<section><h2>${layer.name}</h2><p class="blurb">${layer.blurb}</p><div class="grid">${cards}</div></section>`;
          })
          .join('');
      }

      async function tick() {
        const dot = document.getElementById('dot');
        try {
          const response = await fetch('/api/board', { cache: 'no-store' });
          if (!response.ok) throw new Error(`board ${response.status}`);
          const board = await response.json();
          renderCall(board);
          renderLayers(board);
          dot.className = `dot ${board.switch?.reachable ? 'on' : 'bad'}`;
          document.getElementById('stamp').textContent = `${board.tally.up} up · ${board.tally.configured} answering · ${board.tally.missing} not configured`;
          document.getElementById('tagline').textContent = `${board.tagline} · ${board.domain}`;
          document.getElementById('footer').textContent =
            `${board.name} · board ${new Date(board.at).toLocaleTimeString()} · switch ${board.switch?.url || '—'} · did ${board.wiring?.did || '—'}`;
        } catch (error) {
          dot.className = 'dot bad';
          document.getElementById('stamp').textContent = `front door up, board failed: ${error.message}`;
        }
      }

      tick();
      setInterval(tick, 3000);
    </script>
  </body>
</html>
