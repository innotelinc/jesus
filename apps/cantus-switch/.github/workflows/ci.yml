# CI — the switch's suite, on real sockets.
#
# `npm test` starts two switches and a relay, places a call and checks the audio
# that arrived; nothing here is mocked, so a red build means the switch stopped
# working. The package has no dependencies, so there is no install step to fail
# and no lockfile to cache.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: Switch suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Show version
        run: node --version

      - name: Run the suite
        run: npm test
