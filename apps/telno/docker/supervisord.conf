; One container, two processes. Supervisor is PID 1 so signals are handled and
; either process is restarted if it dies.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/var/log/asterisk

[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telno]
command=/usr/local/bin/node /app/src/index.js
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=192"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
