; One container, two processes. Supervisor is PID 1 so signals are handled and
; either process is restarted if it dies.
;
; Supervisor, Asterisk and the API all run as the unprivileged `telno` user
; (see USER in the Dockerfile). Nothing here needs root, which is why the
; image carries no setuid path and no privilege drop: there is no privilege to
; drop, and Asterisk is started without -U/-G because it has no user to switch
; away from.

[supervisord]
nodaemon=true
user=telno
logfile=/dev/null
logfile_maxbytes=0
; /run belongs to root, and this process is not root: the pidfile lives on the
; data volume, which is the one place it is guaranteed to be able to write.
pidfile=/data/run/supervisord.pid
childlogdir=/var/log/asterisk

[program:asterisk]
command=/usr/sbin/asterisk -f
priority=10
autostart=true
autorestart=true
startsecs=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telno]
command=/usr/local/bin/node /app/src/index.js
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=NODE_ENV="production",NODE_OPTIONS="--max-old-space-size=192"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
