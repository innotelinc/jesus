; Base Asterisk configuration for the Telno container.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; No runuser/rungroup: the whole container is unprivileged (USER telno), so
; there is no root to switch away from. Asterisk resolves these names even when
; it is not root, so leaving one here for an account that does not exist is a
; switch that refuses to start. The entrypoint strips them from a volume that
; was written by an older image.
languageprefix = yes
transmit_silence = yes
