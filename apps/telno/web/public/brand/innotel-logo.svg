<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Innotel.US">
  <title>Innotel.US</title>
  <desc>A leaning white i on an aqua-to-indigo tile, its dot in hot pink.</desc>

  <defs>
    <linearGradient id="aqua" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2af0d8"/>
      <stop offset="0.52" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1b2e8f"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="240" y="200" width="320" height="320" rx="84"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#060a18"/>
  <circle cx="600" cy="330" r="520" fill="url(#halo)"/>
  <g stroke="#8fb7ff" stroke-opacity="0.1" stroke-width="3">
    <path d="M96 128H336"/>
    <path d="M864 806H1104"/>
  </g>

  <g transform="translate(600 330) scale(1.1875) translate(-400 -360)">
    <rect x="240" y="218" width="320" height="320" rx="84" fill="#03060f" opacity="0.85"/>
    <rect x="240" y="200" width="320" height="320" rx="84" fill="url(#aqua)"/>
    <rect x="240" y="200" width="320" height="320" rx="84" fill="url(#sweep)" clip-path="url(#tile)"/>
    <rect x="243" y="203" width="314" height="314" rx="81" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="3"/>
    <g transform="translate(400 360) skewX(-8) translate(-400 -360)">
      <rect x="368" y="330" width="64" height="158" rx="32" fill="#ffffff"/>
      <circle cx="400" cy="278" r="34" fill="#ff4fa3"/>
    </g>
  </g>

  <g transform="translate(600 700) skewX(-8)" text-anchor="middle"
     font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
     font-weight="900" font-size="128" letter-spacing="10">
    <text y="0" fill="#ffffff">INNOTEL.US</text>
  </g>
</svg>
