<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Telno">
  <title>Telno</title>
  <desc>An audio waveform that becomes circuit traces with connection nodes, above the TELNO wordmark, on a dark navy grid.</desc>

  <defs>
    <radialGradient id="stage" cx="50%" cy="38%" r="78%">
      <stop offset="0" stop-color="#0e1d42"/>
      <stop offset="0.55" stop-color="#081026"/>
      <stop offset="1" stop-color="#04070f"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#1b2f57" stroke-width="1" opacity="0.55"/>
    </pattern>

    <!-- Emblem-local coordinates (0 0 120 88): cyan at the low left, cobalt at the high right. -->
    <linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" y1="88" x2="120" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.58" stop-color="#e2efff"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>

    <filter id="bloom" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Five waveform bars, then the trace that leaves them and forks into nodes. -->
    <g id="emblem" transform="translate(408 200) scale(3.2)">
      <g fill="none" stroke="url(#pulse)" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 35v18" stroke-width="8"/>
        <path d="M26 26v36" stroke-width="8"/>
        <path d="M42 15v58" stroke-width="8"/>
        <path d="M58 26v36" stroke-width="8"/>
        <path d="M74 35v18" stroke-width="8"/>
        <path d="M82 44h4" stroke-width="6"/>
        <rect x="88" y="32" width="24" height="24" rx="7" stroke-width="6"/>
        <path d="M100 32V18" stroke-width="6"/>
      </g>
      <g fill="url(#pulse)">
        <circle cx="100" cy="44" r="4.5"/>
        <circle cx="100" cy="13" r="5"/>
      </g>
      <g fill="none" stroke="url(#pulse)" stroke-width="2" opacity="0.45">
        <circle cx="100" cy="13" r="9"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="900" fill="url(#stage)"/>
  <rect width="1200" height="900" fill="url(#grid)" opacity="0.5"/>

  <!-- Traces running off the canvas, so the emblem reads as part of a larger circuit. -->
  <g fill="none" stroke="#1d4a7a" stroke-width="2" opacity="0.45">
    <path d="M0 742h300v96h180"/>
    <path d="M1200 168H968V72H860"/>
    <path d="M1200 742h-210v-70"/>
    <path d="M0 168h150v84"/>
  </g>
  <g fill="#2a6ba8" opacity="0.55">
    <circle cx="480" cy="838" r="4"/>
    <circle cx="860" cy="72" r="4"/>
    <circle cx="990" cy="672" r="4"/>
    <circle cx="150" cy="252" r="4"/>
  </g>
  <g fill="#7dd3fc" opacity="0.35">
    <circle cx="316" cy="212" r="2.5"/>
    <circle cx="902" cy="318" r="2"/>
    <circle cx="248" cy="640" r="2"/>
    <circle cx="1054" cy="826" r="2.5"/>
    <circle cx="676" cy="120" r="2"/>
  </g>

  <use href="#emblem" filter="url(#bloom)" opacity="0.55"/>
  <use href="#emblem" filter="url(#glow)"/>

  <g transform="translate(600 700) skewX(-8)"
     text-anchor="middle"
     font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
     font-weight="800"
     font-size="150"
     letter-spacing="14">
    <text y="7" fill="#061024" opacity="0.9">TELNO</text>
    <text y="0" fill="url(#word)" filter="url(#glow)">TELNO</text>
  </g>
</svg>
