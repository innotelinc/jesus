<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Telno and Innotel.US">
  <title>Telno &#215; Innotel.US</title>
  <desc>The pair: a leaning T and a leaning i on matching aqua tiles, each marked with one hot pink dot.</desc>

  <defs>
    <linearGradient id="aqua" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2af0d8"/>
      <stop offset="0.52" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#1b2e8f"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haloLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2af0d8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2af0d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloRight" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileLeft">
      <rect x="240" y="200" width="320" height="320" rx="84"/>
    </clipPath>
    <clipPath id="tileRight">
      <rect x="1040" y="200" width="320" height="320" rx="84"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#060a18"/>
  <circle cx="400" cy="330" r="470" fill="url(#haloLeft)"/>
  <circle cx="1200" cy="330" r="470" fill="url(#haloRight)"/>
  <g stroke="#8fb7ff" stroke-opacity="0.1" stroke-width="3">
    <path d="M120 96H360"/>
    <path d="M1240 804H1480"/>
  </g>

  <!-- TELNO -->
  <g>
    <rect x="240" y="218" width="320" height="320" rx="84" fill="#03060f" opacity="0.85"/>
    <rect x="240" y="200" width="320" height="320" rx="84" fill="url(#aqua)"/>
    <rect x="240" y="200" width="320" height="320" rx="84" fill="url(#sweep)" clip-path="url(#tileLeft)"/>
    <rect x="243" y="203" width="314" height="314" rx="81" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="3"/>
    <g transform="translate(400 360) skewX(-8) translate(-400 -360)">
      <rect x="300" y="246" width="200" height="62" rx="26" fill="#ffffff"/>
      <rect x="368" y="246" width="64" height="240" rx="22" fill="#ffffff"/>
    </g>
    <circle cx="548" cy="508" r="33" fill="#ff4fa3"/>
    <circle cx="548" cy="508" r="33" fill="none" stroke="#060a18" stroke-width="7" opacity="0.8"/>
  </g>

  <g transform="translate(400 700) skewX(-8)" text-anchor="middle"
     font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
     font-weight="900" font-size="112" letter-spacing="10">
    <text y="0" fill="#ffffff">TELNO</text>
  </g>

  <!-- INNOTEL.US -->
  <g>
    <rect x="1040" y="218" width="320" height="320" rx="84" fill="#03060f" opacity="0.85"/>
    <rect x="1040" y="200" width="320" height="320" rx="84" fill="url(#aqua)"/>
    <rect x="1040" y="200" width="320" height="320" rx="84" fill="url(#sweep)" clip-path="url(#tileRight)"/>
    <rect x="1043" y="203" width="314" height="314" rx="81" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="3"/>
    <g transform="translate(1200 360) skewX(-8) translate(-1200 -360)">
      <rect x="1168" y="330" width="64" height="158" rx="32" fill="#ffffff"/>
      <circle cx="1200" cy="278" r="34" fill="#ff4fa3"/>
    </g>
  </g>

  <g transform="translate(1200 700) skewX(-8)" text-anchor="middle"
     font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif"
     font-weight="900" font-size="92" letter-spacing="8">
    <text y="0" fill="#ffffff">INNOTEL.US</text>
  </g>
</svg>
