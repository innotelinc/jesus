# iOS — build the SCIF shell on a macOS runner and hand it to TestFlight.
#
# There is no .xcodeproj in this repository. The project is generated by
# `npx cap add ios` on the runner and shaped by native/scripts, so the app is a
# reproducible build instead of a folder somebody edited in Xcode. macOS runners
# are free for public repositories, which is why this runs here rather than on
# anyone's laptop.
#
# Secrets this job needs (Settings -> Secrets and variables -> Actions):
#   APP_STORE_CONNECT_KEY_ID      the Key ID of an App Store Connect API key
#   APP_STORE_CONNECT_ISSUER_ID   that key's issuer UUID
#   APP_STORE_CONNECT_KEY         the .p8 file's contents
#   APPLE_TEAM_ID                 the 10-character team id
# Variable, optional:
#   APP_BUNDLE_ID                 defaults to us.innotel.scif
#
# One-time, in App Store Connect: the app record must exist for the bundle id,
# and the API key needs App Manager rights, because signing is automatic and the
# runner asks it for the certificate and profile it does not have.
#
# It does not run on every push: without the secrets above it can only fail, and
# a red X nobody can fix is worse than no check at all. Run it from Actions, or
# push a tag like ios-v1.0.0.

name: iOS

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the build to TestFlight
        type: boolean
        default: true
      prepare_only:
        description: Only generate the project and apply the wrapper (no credentials needed)
        type: boolean
        default: false
  push:
    tags: ['ios-v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'us.innotel.scif' }}
      # TestFlight rejects a build number it has already seen, so it is the run
      # number — the alternative is a human remembering to bump it.
      APP_BUILD: ${{ github.run_number }}
      APP_VERSION: '1.0'
      DEPLOYMENT: https://telno.services
      KEY_PATH: ${{ github.workspace }}/.asc/AuthKey.p8

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the credentials are there
        if: ${{ !inputs.prepare_only }}
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -u
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$ISSUER_ID" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$ASC_KEY" ] && missing="$missing APP_STORE_CONNECT_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see native/README.md)"
            exit 1
          fi
          echo "Credentials present for team $TEAM_ID, key $KEY_ID"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install the Capacitor tooling
        working-directory: native
        run: npm install --no-audit --no-fund

      - name: Point the shell at the deployment
        working-directory: native
        run: npm run origin -- "$DEPLOYMENT"

      - name: Generate the iOS project
        working-directory: native
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios
          ls ios/App/App/*.swift 2>/dev/null || true

      - name: Apply the SCIF wrapper
        working-directory: native
        run: |
          set -euo pipefail
          node scripts/ios-prep.mjs
          gem install xcodeproj --no-document
          TEAM_ID="$TEAM_ID" APP_BUNDLE_ID="$APP_BUNDLE_ID" \
            APP_VERSION="$APP_VERSION" APP_BUILD="$APP_BUILD" \
            ruby scripts/ios-project.rb

      # The wrapper is the part that cannot be checked on any other machine: it
      # grafts Swift sources, plist keys and an entitlement onto a project Apple's
      # template generated minutes earlier. This run proves that graft — and that
      # the generated project still builds — without an Apple account.
      - name: Prove the wrapper applied (no credentials)
        if: ${{ inputs.prepare_only }}
        working-directory: native
        run: |
          set -euo pipefail
          test -d ios/App/App.xcodeproj
          test -f ios/App/App/ScifCallManager.swift
          test -f ios/App/App/App.entitlements
          if [ -f ios/App/App/Info.merged.plist ]; then echo "the plist merge left its scratch file behind"; exit 1; fi
          # pbxproj is OpenStep-format, not XML, so this is a text check: each
          # plugin has to appear in the App target's Sources phase.
          for plugin in ScifCallManager ScifCallPlugin ScifSpeechPlugin ScifBiometricsPlugin; do
            grep -q "$plugin.swift in Sources" ios/App/App.xcodeproj/project.pbxproj || {
              echo "$plugin.swift is not in the App target's sources"
              exit 1
            }
          done
          echo "Four plugins in Sources"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/App/App/Info.plist | tr '\n' ' '
          echo
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :aps-environment' ios/App/App/App.entitlements
          grep -c 'ScifCallManager.shared.start()' ios/App/App/AppDelegate.swift
          echo "The wrapper applied to the generated project."

      - name: Write the App Store Connect key
        if: ${{ !inputs.prepare_only }}
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          # xcodebuild wants it at a path we choose as well; altool reads the one above.
          mkdir -p "$(dirname "$KEY_PATH")"
          cat "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive
        if: ${{ !inputs.prepare_only }}
        working-directory: native
        run: |
          set -euo pipefail
          # The archive is deliberately unsigned. Under automatic signing Xcode
          # archives with the *development* identity, and Apple will not mint an
          # iOS App Development profile for a team with no registered devices:
          # "Your team has no devices from which to generate a provisioning
          # profile". Handing it a distribution identity instead is refused as a
          # conflict, because automatic signing decides the type itself.
          #
          # Export is where the App Store build is actually signed: with an
          # App Store Connect key, -allowProvisioningUpdates creates the
          # distribution certificate and profile there (cloud signing), and an
          # App Store profile needs no devices. So compile the archive without a
          # signature and let the export step do the signing.
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Export the .ipa
        if: ${{ !inputs.prepare_only }}
        working-directory: native
        run: |
          set -euo pipefail
          sed "s/__TEAM_ID__/${TEAM_ID}/" ExportOptions.plist > "$PWD/build/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build/ipa" -exportOptionsPlist "$PWD/build/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -l "$PWD/build/ipa"

      - name: Upload the build as an artifact
        if: ${{ !inputs.prepare_only }}
        uses: actions/upload-artifact@v5
        with:
          name: SCIF-${{ github.run_number }}
          path: native/build/ipa/*.ipa
          if-no-files-found: error

      - name: Send it to TestFlight
        if: ${{ !inputs.prepare_only && (github.event_name == 'push' || inputs.upload) }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f native/build/ipa/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded build $APP_BUILD of $APP_VERSION — it appears in App Store Connect under TestFlight after processing."
