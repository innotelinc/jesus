name: telno

# Two services, because telephony is a service now.
#
#   cantus   the Cantus switch: one UDP port for signalling *and* media, one
#            TCP port for the control API and the ARI-compatible surface
#   telno    this platform: the console, the database, the directory, and the
#            routing document the switch loads
#
# Neither image contains the other. `docker compose up -d` on its own is a
# working two-container PBX; the estate compose in `estate/` adds the rest of
# the products on top of exactly this pair.

services:
  cantus:
    build:
      context: ../cantus-switch
    image: cantus-switch:latest
    container_name: cantus
    restart: unless-stopped
    hostname: cantus
    environment:
      CANTUS_DOMAIN: ${CANTUS_DOMAIN:-telno.local}
      CANTUS_ID: ${CANTUS_ID:-switch@telno.local}
      CANTUS_SECRET: ${CANTUS_SECRET:?set CANTUS_SECRET — every Cantus node shares this signing secret}
      CANTUS_CONTROL_TOKEN: ${CANTUS_CONTROL_TOKEN:?set CANTUS_CONTROL_TOKEN — the platform authenticates with it}
      CANTUS_ROUTES_FILE: /data/cantus/routes.json
      CANTUS_RECORD_DIR: /data/recordings
      CANTUS_PROMPTS: /data/prompts
      CANTUS_BIND: 0.0.0.0:7443
      CANTUS_RELAY_BIND: 0.0.0.0:7444
      CANTUS_ADVERTISE: ${CANTUS_ADVERTISE:-}
      CANTUS_HTTP_PORT: 8088
      CANTUS_ARI_USER: ${CANTUS_ARI_USER:-dograh}
      CANTUS_ARI_PASSWORD: ${CANTUS_ARI_PASSWORD:-}
      CANTUS_ARI_APP: ${CANTUS_ARI_APP:-dograh}
      # The platform exposes the line inventory the switch registers, so a new
      # extension is dialable without a second configuration surface.
      CANTUS_LINES_URL: http://telno:8080/api/cantus/lines
    volumes:
      - telno-data:/data
    # Cantus needs exactly two UDP ports and one TCP port. No RTP range, no SIP
    # port, no TLS listener for a browser to trust.
    ports:
      - "${CANTUS_SIGNAL_PORT:-7443}:7443/udp"
      - "${CANTUS_RELAY_PORT:-7444}:7444/udp"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  telno:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: telno:latest
    container_name: telno
    restart: unless-stopped
    hostname: telno
    depends_on:
      cantus:
        condition: service_started
    ports:
      - "${TELNO_PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CANTUS_URL: http://cantus:8088
      CANTUS_CONTROL_TOKEN: ${CANTUS_CONTROL_TOKEN}
      CANTUS_DOMAIN: ${CANTUS_DOMAIN:-telno.local}
      CANTUS_CONFIG_DIR: /data/cantus
      CANTUS_RECORD_DIR: /data/recordings
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-US}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@telno.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DIRECTORY_DOMAINS: ${DIRECTORY_DOMAINS:-telno.directory,num.directory,number.directory,directory.telno.services,directory.pbx.services,directory.pbx.technology}
      DIRECTORY_CANONICAL: ${DIRECTORY_CANONICAL:-telno.directory}
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-console}
      NOTIFY_FROM: ${NOTIFY_FROM:-directory@telno.directory}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAILJET_API_KEY: ${MAILJET_API_KEY:-}
      MAILJET_API_SECRET: ${MAILJET_API_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SOFTPHONE_ENABLED: ${SOFTPHONE_ENABLED:-true}
      PROVISIONING_ENABLED: ${PROVISIONING_ENABLED:-true}
      PROVISIONING_URL: ${PROVISIONING_URL:-https://telno.tel}
      PROVISIONING_SIP_DOMAIN: ${PROVISIONING_SIP_DOMAIN:-}
      PROVISIONING_SIP_PORT: ${PROVISIONING_SIP_PORT:-5060}
      # Fax needs a T.38 gateway; Cantus carries voice only. Off unless the
      # gateway address is supplied, so the screen never offers a dead button.
      FAX_ENABLED: ${FAX_ENABLED:-false}
      FAX_GATEWAY: ${FAX_GATEWAY:-}
      FAX_STATION_ID: ${FAX_STATION_ID:-Telno}
      FAX_DIR: ${FAX_DIR:-}
      APNS_ENABLED: ${APNS_ENABLED:-false}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-us.innotel.scif}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-development}
      PARKING_ENABLED: ${PARKING_ENABLED:-false}
      REMINDER_DAYS: ${REMINDER_DAYS:-1,3,7,14,30}
      ESCALATION_ENABLED: ${ESCALATION_ENABLED:-true}
      PAYMENTS_ENABLED: ${PAYMENTS_ENABLED:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      VOIPMS_API_USERNAME: ${VOIPMS_API_USERNAME:-}
      VOIPMS_API_PASSWORD: ${VOIPMS_API_PASSWORD:-}
      VOIPMS_ROUTING: ${VOIPMS_ROUTING:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      ALLOW_INSECURE_PUBLIC_URL: ${ALLOW_INSECURE_PUBLIC_URL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      # One volume, shared with the switch: the database, the routing document,
      # the prompts and the recordings are all the same working set.
      - telno-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

volumes:
  telno-data:
