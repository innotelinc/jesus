# ═══════════════════════════════════════════════════════════════════════════
# Capstone — PBX / Asterisk side (FreePBX 17 + Asterisk 22 + AvantFax)
#
# Companion to docker-compose.yml. Runs the Innotel FreePBX fullstack image
# (ghcr.io/innotelinc/pbx-portal:latest-fullstack, built by the pbx-portal
# repo's GitHub Actions) and injects the dograh ARI wiring on boot:
#
#   • ari.conf                ARI user [dograh]  →  Stasis App Name "dograh"
#   • http.conf               Asterisk HTTP on 8088
#   • websocket_client.conf   external media WS  →  dograh-api (host :3010)
#   • extensions_custom.conf  [dograh-inbound] context  →  Stasis(dograh)
#
# Networking: dograh-api in docker-compose.yml runs in HOST mode, so it
# reaches this PBX on 127.0.0.1:8088 (the published ARI port). This container
# joins the same interview-net bridge and reaches dograh back through
# host.docker.internal (media WebSocket).
#
# Run together with the main stack:
#     docker compose -f docker-compose.yml -f docker-compose.asterisk.yml up -d
# Or standalone (PBX only):
#     docker compose -f docker-compose.asterisk.yml up -d
#
# Ports:
#   80        FreePBX web UI
#   5060/udp  SIP signalling              5061/tcp  SIP TLS (optional)
#   8088      Asterisk HTTP / ARI         (dograh host-mode → 127.0.0.1:8088)
#   8089      PJSIP WebSocket (WSS)       for WebRTC softphones
#   5038      Asterisk AMI
#   10000     Webmin admin panel (optional)
#   10101-10120/udp  RTP media range (20 ports ≈ 10 concurrent calls)
# ═══════════════════════════════════════════════════════════════════════════

services:
  freepbx:
    # Pre-built fullstack image (Asterisk 22.10 + FreePBX 17 + AvantFax +
    # bundled MariaDB). Build locally instead with the pbx-portal repo:
    #   docker compose -f docker-compose.full.yml -f docker-compose.full.build.yml up -d
    # Override with FREEPBX_IMAGE for an offline/local build (e.g. innotel/freepbx:latest).
    image: ${FREEPBX_IMAGE:-ghcr.io/innotelinc/pbx-portal:latest-fullstack}
    container_name: pbx-freepbx
    restart: unless-stopped
    # Same as pbx-portal's compose: host has AppArmor purged; keep the
    # docker-default profile from being applied to this container.
    security_opt:
      - apparmor=unconfined
    # Bootstrap wrapper: injects the dograh ARI configs below, then execs the
    # stock /usr/local/bin/entrypoint.sh (which starts MariaDB → Asterisk →
    # web stack and does a final `core restart now`, picking up our configs).
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint-dograh.sh"]
    ports:
      - "80:80"                         # FreePBX web UI
      - "5060:5060/udp"                 # SIP
      - "5061:5061/tcp"                 # SIP TLS
      - "8088:8088"                     # Asterisk HTTP / ARI (dograh host-mode)
      - "8089:8089"                     # PJSIP WebSocket (WSS)
      - "5038:5038"                     # Asterisk AMI
      - "${FREEPBX_WEBMIN_PORT:-10000}:10000" # Webmin admin panel (optional; host port configurable)
      # Explicitly publish only the dedicated RTP range. Do not publish the
      # image's default 10000-20000 UDP range; TCP 10000 belongs to Webmin.
      - "${FREEPBX_RTP_PORT_START:-10101}-${FREEPBX_RTP_PORT_END:-10120}:10101-10120/udp" # RTP media (20 ports / 10 active calls)
    environment:
      HOSTNAME: ${HOSTNAME:-voice.innotel.us}
      # dograh ARI wiring (consumed by pbx/entrypoint-dograh.sh)
      DOGRAH_ARI_PASSWORD: ${DOGRAH_ARI_PASSWORD:-}
      DOGRAH_WS_URI: ${DOGRAH_WS_URI:-}
      # RTP range — must match the published ports above; the entrypoint
      # writes these into FreePBX's kvstore_Sipsettings (durable).
      FREEPBX_RTP_PORT_START: ${FREEPBX_RTP_PORT_START:-10101}
      FREEPBX_RTP_PORT_END: ${FREEPBX_RTP_PORT_END:-10120}
      # AMI credentials (used by the PBX portal; harmless here)
      FREEPBX_AMI_USER: ${FREEPBX_AMI_USER:-pbxportal}
      FREEPBX_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}
      # Optional VoIP.ms SIP trunk auto-config (entrypoint supports it)
      VOIPMS_SIP_USER: ${VOIPMS_SIP_USER:-}
      VOIPMS_SIP_PASS: ${VOIPMS_SIP_PASS:-}
      VOIPMS_SIP_SERVER: ${VOIPMS_SIP_SERVER:-newyork1.voip.ms}
      # Asterisk watchdog (self-heals a dropped control socket)
      ASTERISK_WATCHDOG_INTERVAL: ${ASTERISK_WATCHDOG_INTERVAL:-30}
      ASTERISK_WATCHDOG_COOLDOWN: ${ASTERISK_WATCHDOG_COOLDOWN:-60}
    volumes:
      # dograh ARI configs + bootstrap wrapper (read-only)
      - ./pbx/asterisk:/opt/pbx-dograh:ro
      - ./pbx/entrypoint-dograh.sh:/usr/local/bin/entrypoint-dograh.sh:ro
      # Persistent FreePBX state (same volume names as pbx-portal's compose,
      # so the two stacks can share a box)
      - asterisk-config:/etc/asterisk
      - asterisk-sounds:/var/lib/asterisk/sounds
      - asterisk-spool:/var/spool/asterisk
      - freepbx-www:/var/www/html
      - mariadb-data:/var/lib/mysql
    # Lets the media WebSocket client reach host-mode dograh-api on port 8000.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - interview-net

  # ── PBX Customer Portal (Next.js) — optional ────────────────────────────
  # The pbx-portal web app (https://github.com/innotelinc/pbx-portal). Not
  # needed for the mock-interview flow (dograh handles the calls); enable with
  # `docker compose -f docker-compose.asterisk.yml --profile portal up -d`.
  # Requires the pbx-portal .env vars (see pbx/README.md).
  portal:
    image: ghcr.io/innotelinc/pbx-portal:latest
    container_name: pbx-portal
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    profiles: ["portal"]
    depends_on:
      - freepbx
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      SESSION_SECRET: ${SESSION_SECRET:-}
      FREEPBX_URL: http://freepbx
      FREEPBX_CLIENT_ID: ${FREEPBX_CLIENT_ID:-pbxportal-api}
      FREEPBX_CLIENT_SECRET: ${FREEPBX_CLIENT_SECRET:-}
      ASTERISK_AMI_HOST: freepbx
      ASTERISK_AMI_PORT: "5038"
      ASTERISK_AMI_USERNAME: ${FREEPBX_AMI_USER:-pbxportal}
      ASTERISK_AMI_SECRET: ${FREEPBX_AMI_SECRET:-}
      NEXT_PUBLIC_FREEPBX_WSS_URL: wss://${FREEPBX_WSS_HOST:-localhost}:8089/ws
    volumes:
      - portal-data:/app/data
      - asterisk-config:/etc/asterisk:rw
    networks:
      - interview-net

volumes:
  asterisk-config:
    name: pbx-asterisk-config
    external: true
  asterisk-sounds:
    name: pbx-asterisk-sounds
    external: true
  asterisk-spool:
    name: pbx-asterisk-spool
    external: true
  freepbx-www:
    name: pbx-freepbx-www
    external: true
  mariadb-data:
    name: pbx-mariadb-data
    external: true
  portal-data:
    name: pbx-portal-data
    external: true

networks:
  interview-net:
    name: interview-net
    external: true
