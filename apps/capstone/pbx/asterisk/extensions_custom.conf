; Dograh voice-agent inbound contexts (FreePBX-safe).
;
; extensions_custom.conf is #include'd by FreePBX's extensions.conf and is NOT
; regenerated on Apply Config, so these contexts survive GUI reloads. The
; entrypoint (pbx/entrypoint-dograh.sh) merges this file into the PBX's
; extensions_custom.conf on every boot — per CONTEXT, idempotently: a context
; defined here replaces its counterpart there (this file is canonical), and
; contexts only present on the PBX side are left untouched. Edit THIS file
; (never the volume copy) and restart the freepbx container to propagate.
;
; The Stasis app name here is the LEGACY default ("dograh" = the ARI
; username). dograh now generates a per-config Stasis app name
; (dograh_<hex>); the entrypoint rewrites Stasis(dograh) to Stasis(<that
; name>) on every boot when DOGRAH_STASIS_APP_NAME is set (persisted by
; scripts/dograh_wire.py from the dograh API).
;
; Extension → agent routing (must match scripts/dograh_wire.py and
; ansible/dograh-ari.yml):
;   8000 → IT Help Desk Mock Interview
;   8001 → DevOps Mock Interview
;   8002 → SQL Mock Interview
;   8003 → Business Receptionist
;   8004 → Outbound Outreach

; Inbound target: calls land here and are handed to the dograh Stasis app.
; dograh matches the call by dialplan exten at StasisStart and looks up the
; phone number (8000/8001/8002) registered on the ARI telephony config —
; so keep these concrete numbers, never "s".
[dograh-inbound]
exten => 8000,1,NoOp(Dograh voice agent inbound)
 same => n,Stasis(dograh)
 same => n,Hangup()

exten => 8001,1,NoOp(Dograh DevOps interview inbound)
 same => n,Stasis(dograh)
 same => n,Hangup()

exten => 8002,1,NoOp(Dograh SQL interview inbound)
 same => n,Stasis(dograh)
 same => n,Hangup()

exten => 8003,1,NoOp(Dograh receptionist inbound)
 same => n,Stasis(dograh)
 same => n,Hangup()

exten => 8004,1,NoOp(Dograh outbound-outreach agent)
 same => n,Stasis(dograh)
 same => n,Hangup()

; Register more Dograh extensions by adding exten lines, or catch a range:
; exten => _8XXX,1,NoOp(Dograh voice agent inbound ${EXTEN})
;  same => n,Stasis(dograh)
;  same => n,Hangup()

; Internal dialing: FreePBX's generated [from-internal] includes this context
; BEFORE the module-generated contexts, so any SIP extension registered to the
; PBX can dial the interview lines directly (agent answers).
[from-internal-custom]
exten => 8000,1,NoOp(Dialing the IT Help Desk interview agent)
 same => n,Goto(dograh-inbound,8000,1)

exten => 8001,1,NoOp(Dialing the DevOps interview agent)
 same => n,Goto(dograh-inbound,8001,1)

exten => 8002,1,NoOp(Dialing the SQL interview agent)
 same => n,Goto(dograh-inbound,8002,1)

exten => 8003,1,NoOp(Dialing the receptionist agent)
 same => n,Goto(dograh-inbound,8003,1)

exten => 8004,1,NoOp(Dialing the outbound outreach agent)
 same => n,Goto(dograh-inbound,8004,1)
