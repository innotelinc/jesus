; External media WebSocket client for Dograh (capstone, single-box).
; Installed into /etc/asterisk/websocket_client.conf by pbx/entrypoint-dograh.sh.
;
; Asterisk streams call audio to dograh-api (host-mode, port 8000) over this
; WebSocket.
;
; ADDRESSING RULE: the URI must be this host's LAN IP — docker addresses do
; not resolve for this project. In particular `host.docker.internal` is NOT
; resolvable inside the PBX container (there is no extra_hosts entry), and
; ast_sockaddr_resolve fails on it, so a media WebSocket pointed there fails
; silently: calls connect with no audio and nothing appears in the log.
; Override per host with DOGRAH_WS_URI; the entrypoint repairs a leftover
; host.docker.internal to PJSIP_MEDIA_ADDRESS when that is unset.
;
; The section name [dograh] is the "WebSocket Client Name" you enter in Dograh
; at Telephony Configurations.
;
; Override the URI via DOGRAH_WS_URI in .env (e.g. for a TLS-fronted dograh,
; set tls_enabled = yes + ca_list_file = /etc/ssl/certs/ca-certificates.crt
; and use wss://). The media socket itself is authenticated per call by dograh
; appending ?workflow_id=...&token=... dynamically, so no static token here.

[dograh]
type = websocket_client
uri = ws://192.168.1.46:8000/api/v1/telephony/ws/ari
protocols = media
tls_enabled = no
