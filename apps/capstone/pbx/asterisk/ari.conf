; ARI user for Dograh (capstone) — the section Asterisk actually reads.
;
; Converged into /etc/asterisk/ari.conf on every boot by
; pbx/entrypoint-dograh.sh via the shared-voice-plane renderer
; (pbx/asterisk_converge.py): the [dograh] section replaces wholesale,
; while [general] and any other users (e.g. a zeus ARI user on a shared
; PBX) pass through untouched.
;
; Why NOT ari_additional_custom.conf: earlier builds shipped the user in
; ari_additional_custom.conf on the assumption that /etc/asterisk/ari.conf
; is a module-managed symlink that regenerates and #includes the custom
; file. Verified against the pbx-portal fullstack image: ari.conf is a
; plain file (not a symlink), contains NO `#include
; ari_additional_custom.conf`, and is NOT regenerated by `fwconsole
; reload` or the capstone-pbx-sync timer — so the custom-file install was
; dead weight and a fresh install shipped with no ARI user at all. The
; [dograh] section therefore lives here, in the file Asterisk reads, and
; the entrypoint re-converges it idempotently on every boot.
;
; The [dograh] section name is the "Stasis App Name" you enter in Dograh
; at Telephony Configurations; the password must match the "App Password"
; there. Prefer overriding the password via DOGRAH_ARI_PASSWORD in .env
; (the entrypoint renders it in on every boot) instead of editing this
; file.
[dograh]
type = user
read_only = no
password = CHANGE_ME_ARI_PASSWORD
