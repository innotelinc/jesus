; ARI user for Dograh (capstone).
; Installed into /etc/asterisk/ari_additional_custom.conf by
; pbx/entrypoint-dograh.sh on boot.
;
; This MUST live in ari_additional_custom.conf (NOT ari.conf): ari.conf is
; symlinked to the arimanager module and regenerated on every `fwconsole
; reload` / Apply Config (the capstone-pbx-sync timer runs fwconsole reload),
; which silently drops any user written directly into it. The *_custom.conf
; include is never regenerated, so the [dograh] ARI user survives reloads.
;
; The [dograh] section name is the "Stasis App Name" you enter in Dograh at
; Telephony Configurations; the password must match the "App Password" there.
; Prefer overriding the password via DOGRAH_ARI_PASSWORD in .env (the
; entrypoint sed's it in on every boot) instead of editing this file.

[dograh]
type = user
read_only = no
password = CHANGE_ME_ARI_PASSWORD
