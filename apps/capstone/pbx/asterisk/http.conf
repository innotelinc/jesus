; Asterisk HTTP server for ARI (capstone)
;
; FreePBX 17 manages HTTP via http_additional.conf (the stock entrypoint
; rewrites its binds to 0.0.0.0:8088/8089 on boot), so this file is only a
; fallback to guarantee res_http_websocket / res_ari have a base config if the
; image does not ship one. The entrypoint installs it ONLY when missing.
;
; Keep 8088 off the public router — dograh reaches it on the LAN/loopback.

[general]
enabled = yes
bindaddr = 0.0.0.0
bindport = 8088
