; RTP media port range for the dograh inbound calls (capstone).
;
; This file is the SOURCE that pbx/entrypoint-dograh.sh copies into the
; container's /etc/asterisk/rtp_custom.conf on every boot. The entrypoint
; rewrites the runtime copy canonically (stunaddr/icesupport + rtpstart/rtpend
; from FREEPBX_RTP_PORT_START..END, default 10101-10120) so it always matches
; what the freepbx service in docker-compose.yml publishes.
;
; NOTE: on FreePBX (Asterisk 22), config reads are first-wins, so an included
; file cannot override the generated rtp_additional.conf. The durable fix is
; the kvstore_Sipsettings write in pbx/entrypoint-dograh.sh, which makes
; fwconsole regenerate rtp_additional.conf with these values. This file stays
; as the canonical fallback for images/versions where last-wins applies.
;
; STUN/TURN point at the local coturn (same compose network, service name
; `coturn` :3478) so Asterisk's RTP engine can discover its external address
; (STUN) and relay media through TURN for ICE/WebRTC peers behind NAT.
; Override the address with PJSIP_STUN_TURN_ADDR; the port follows
; TURN_LISTENING_PORT. (Do not use host.docker.internal here — Asterisk's
; ast_sockaddr_resolve fails on that alias and silently disables STUN.)
[general]
stunaddr = coturn:3478
icesupport = yes
rtpstart=10101
rtpend=10120
