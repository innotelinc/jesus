; RTP media port range for the dograh inbound calls (capstone).
;
; NOTE: on FreePBX (Asterisk 22), config reads are first-wins, so this file
; CANNOT override the generated rtp_additional.conf. The durable fix is the
; kvstore_Sipsettings write in pbx/entrypoint-dograh.sh, which makes fwconsole
; regenerate rtp_additional.conf with these values. This file is a fallback
; for images/versions where last-wins applies.
;
; The range matches what docker-compose.asterisk.yml actually publishes
; (FREEPBX_RTP_PORT_START..END, default 10101-10120/udp). FreePBX's default
; (10000-20000) would let Asterisk pick RTP ports the container never
; publishes — external callers would get one-way audio.
[general]
rtpstart=10101
rtpend=10120
