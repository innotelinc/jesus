; RTP media port range for the dograh inbound calls (capstone).
;
; This file is included by /etc/asterisk/rtp.conf AFTER rtp_additional.conf
; (FreePBX's generated file), so these values WIN on merge. It caps the range
; to what docker-compose.asterisk.yml actually publishes (10101-10120/udp).
; FreePBX's default (10000-20000) would let Asterisk pick RTP ports that the
; container never publishes — external callers would get one-way audio.
;
; FreePBX does not regenerate rtp_custom.conf on Apply Config / fwconsole
; reload, so this override is durable. The entrypoint re-appends it if the
; file is missing (fresh volumes).
[general]
rtpstart=10101
rtpend=10120
