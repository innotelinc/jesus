# Fail2ban filter — Asterisk/PJSIP security events.
#
# Asterisk emits one record per rejected SIP message to the `security` log
# channel (enabled by pbx/entrypoint-dograh.sh via logger.conf), written by
# res_security_log.c as a key/value body. Its shape is:
#
#   [2026-09-12 14:03:00] SECURITY[1234] res_security_log.c: SecurityEvent="InvalidPassword",
#   EventTV="2026-09-12T14:03:00.123-0400",Severity="Error",Service="PJSIP",
#   EventVersion="1",AccountID="6001",SessionID="0x7f...",LocalAddress="IPV4/UDP/192.168.1.46/5060",
#   RemoteAddress="IPV4/UDP/172.110.223.87/52144",...
#
# The address to ban is the IP inside RemoteAddress — the peer that sent the
# message. LocalAddress is this PBX and must never be the match.
#
# `SuccessfulAuth` is deliberately NOT in the list below: it is the event every
# *legitimate* registration produces. Banning on it would blackhole a working
# phone on its first packet. `ChallengeSent` is excluded for the same reason —
# it is the challenge half of a normal registration exchange.
#
# `RequestBadFormat` IS in the list because the only sources of it here are
# scanners on the AMI port. 5038 is published — probes do arrive from the
# internet — while the ACL on *every* AMI user admits only loopback and the LAN,
# so no legitimate peer can send a malformed request: every such event from
# outside the exempt ranges is a probe. Live case: three addresses
# (185.233.247.245, 172.236.228.202, 172.236.228.245) sent ten
# `Service="AMI"` / `RequestType="Action: NONE"` records and were not banned by
# either jail, because the PJSIP-only filter never looks at AMI traffic and this
# one did not list the event.

[Definition]

failregex = ^\[[^\]]*\] SECURITY\[\d+\] res_security_log\.c: SecurityEvent="(?:InvalidPassword|ChallengeResponseFailed|InvalidAccountID|RequestNotAllowed|AuthMethodNotSupported|FailedACL|SessionTimeout|RequestBadFormat)".*RemoteAddress="IPV4/(?:UDP|TCP)/<HOST>/\d+"

ignoreregex =
