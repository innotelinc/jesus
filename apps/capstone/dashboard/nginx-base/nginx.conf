# nginx for the Control Center base. The server block itself is never here: it
# arrives as /etc/nginx/templates/default.conf.template and is rendered into
# conf.d/ at container start (see docker-entrypoint.sh).
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log    /dev/stdout;

    sendfile           on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
