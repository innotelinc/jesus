server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The control-panel aggregator (dashboard-api) reachable same-origin via
    # /api. Trailing slash drops the /api prefix: /api/services ->
    # dashboard-api:8095/services.
    location /api/ {
        proxy_pass http://dashboard-api:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # SPA fallback so client-side routes deep-link correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}