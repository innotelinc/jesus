server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The control-panel aggregator (dashboard-api) reachable same-origin via
    # /api. The rewrite drops the /api prefix: /api/services ->
    # dashboard-api:8095/services.
    #
    # Resolve the upstream per request via Docker's embedded DNS: a static
    # proxy_pass resolves the name once at startup, so recreating dashboard-api
    # (new container IP) would leave nginx pointing at a dead address and every
    # /api call answering 502 until nginx reloads.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $dashboard_api http://dashboard-api:8095;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Operator-visible handlers can take tens of seconds on a loaded box: a
        # FreePBX probe, an ARI recovery poll, the Agents list converging a
        # half-wired row. At the old 30s this proxy answered 504 before the
        # handler could, which reads as "the backend is down" when it is only
        # slow. 120s gives the handler room to finish — or to bound itself and
        # answer — instead of being cut off mid-flight.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Softphone line. The SPA opens wss://<this host>/ws, and this origin
    # forwards the upgrade to the voice plane's Cantus line socket. The switch
    # speaks plain ws on its control port, so there is no self-signed listener
    # and no proxy_ssl_verify to disable: the browser's only certificate is this
    # proxy's, issued for this host.
    #
    # The query string is forwarded explicitly. The softphone sends `ext` (and a
    # `ticket` when the platform mints one), and a proxy_pass that names a URI
    # through a variable does not append the original args on its own — the
    # switch would then see a line socket with no extension and refuse it.
    #
    # Upstream: DASHBOARD_PBX_WSS_HOST (rendered here at container start by
    # envsubst) names the switch from this container's networks — default
    # `capstone-cantus`. Resolved per request through Docker's embedded DNS so
    # the dashboard still boots (and serves /api) when the switch is down;
    # /ws then returns 502 and the console says so.
    location = /ws {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $switch_ws http://${DASHBOARD_PBX_WSS_HOST}:8088;
        proxy_pass $switch_ws/ws/line$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback so client-side routes deep-link correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}