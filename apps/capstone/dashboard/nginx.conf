server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The control-panel aggregator (dashboard-api) reachable same-origin via
    # /api. The rewrite drops the /api prefix: /api/services ->
    # dashboard-api:8095/services.
    #
    # Resolve the upstream per request via Docker's embedded DNS: a static
    # proxy_pass resolves the name once at startup, so recreating dashboard-api
    # (new container IP) would leave nginx pointing at a dead address and every
    # /api call answering 502 until nginx reloads.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $dashboard_api http://dashboard-api:8095;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $dashboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # WebRTC softphone signaling. The SPA registers over wss://<this host>/ws,
    # so this origin must forward the WebSocket upgrade to the PBX's PJSIP WSS
    # listener. Doing it here (rather than from the browser straight to
    # pbx-freepbx:8089) means the browser only ever talks to the reverse
    # proxy's trusted certificate — Asterisk's own listener keeps its
    # build-time self-signed cert, which browsers reject outright.
    #
    # Resolve the upstream per request via Docker's embedded DNS instead of at
    # startup, so the dashboard still boots (and serves /api) when the PBX is
    # down; /ws then just returns 502.
    location = /ws {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $pbx_wss https://pbx-freepbx:8089;
        proxy_pass $pbx_wss/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Upstream TLS is Asterisk's self-signed cert; the certificate that
        # matters to the browser is the proxy's (Cerulean/NPM), issued for
        # this host.
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # SPA fallback so client-side routes deep-link correctly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}