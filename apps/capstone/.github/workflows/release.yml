# ═══════════════════════════════════════════════════════════════════════════
# release.yml — Capstone release pipeline.
#
# Fires on every `v*` tag push (and on demand via workflow_dispatch):
#   1. build-and-publish — builds the Capstone-built images from their
#      Dockerfiles (n8n + OTel, Workflow Studio, Control Center dashboard,
#      dashboard API) and publishes them to GHCR under the repository's own
#      namespace: ghcr.io/<owner>/<repo>/<image>:<tag> (+ :latest).
#   2. release-artifacts — rebuilds the source bundle + deployment payload
#      and attaches them to the GitHub Release for the pushed tag.
#
# The dograh/PBX images are upstream builds pulled by the compose file, not
# built here; the sync-and-release workflow handles dograh fork updates.
# ═══════════════════════════════════════════════════════════════════════════

name: Capstone release pipeline

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag to build (default: use the pushed tag)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: capstone-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The repository's own GHCR namespace (ghcr.io/<owner>/<repo>).
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-publish:
    name: Build & publish Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
          fi
          [ -n "$TAG" ] || TAG="$(git rev-parse --short HEAD)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each matrix row builds one local Dockerfile and pushes it as
      # ghcr.io/<owner>/<repo>/<image>:<tag> + :latest.
      - name: Build & push images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          build_and_push() {
            local name="$1" dockerfile="$2" context="$3"
            local full="$REGISTRY/$IMAGE_NAMESPACE/$name"
            docker build -f "$dockerfile" -t "$full:$IMAGE_TAG" -t "$full:latest" "$context"
            docker push "$full:$IMAGE_TAG"
            docker push "$full:latest"
            echo "::notice::published $full:$IMAGE_TAG"
          }
          build_and_push capstone-n8n-otel         n8n.Dockerfile              .
          build_and_push capstone-workflow-studio  workflow-studio.Dockerfile  .
          build_and_push capstone-dashboard        dashboard/Dockerfile        dashboard
          build_and_push capstone-dashboard-api    dashboard-backend/Dockerfile dashboard-backend

  release-artifacts:
    name: Generate release artifacts
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build source bundle
        run: ./scripts/build-source-bundle.sh

      - name: Build deployment payload
        run: ./scripts/build-offline-bundle.sh --deployment-only

      - name: Attach artifacts to the release
        run: |
          NOTES=$(cat <<NOTESEOF
          Capstone **$VERSION** — generated by the release pipeline.

          **Artifacts**
          - Source bundle (\`capstone-source-bundle.tar.gz\` + checksum)
          - Deployment payload (\`capstone-v2-deployment.tar.gz\` + \`SHA256SUMS\`)

          **Docker images** (published to GHCR by this run):
          \`ghcr.io/${{ github.repository }}/capstone-n8n-otel:${{ github.ref_name }}\`, plus
          \`capstone-workflow-studio\`, \`capstone-dashboard\`, \`capstone-dashboard-api\`
          (each also tagged \`:latest\`).
          NOTESEOF
          )
          # The tag already exists (created by the push); create-or-update the
          # release and upload the artifacts onto it.
          gh release create "$VERSION" \
            dist/source-bundle/capstone-source-bundle.tar.gz \
            dist/source-bundle/capstone-source-bundle.tar.gz.sha256 \
            dist/offline-bundle/capstone-v2-deployment.tar.gz \
            dist/offline-bundle/SHA256SUMS \
            --title "Capstone $VERSION" \
            --notes "$NOTES" || \
          gh release upload "$VERSION" \
            dist/source-bundle/capstone-source-bundle.tar.gz \
            dist/source-bundle/capstone-source-bundle.tar.gz.sha256 \
            dist/offline-bundle/capstone-v2-deployment.tar.gz \
            dist/offline-bundle/SHA256SUMS --clobber
          echo "::notice::release artifacts attached to $VERSION"
