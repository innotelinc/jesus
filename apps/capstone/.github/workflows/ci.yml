# ═══════════════════════════════════════════════════════════════════════════
# ci.yml — static analysis on push and pull requests.
#
# The ShellCheck job runs over every tracked shell script (scripts/*.sh plus
# the .githooks helpers) with bash semantics. The repo is maintained at zero
# findings: intentional patterns (dynamic .env source, the $ASTERISK
# command-string split, node -e template literals) are documented with inline
# shellcheck directives, so this job fails the build if a commit reintroduces
# any warning, error, or note.
# ═══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck tracked shell scripts
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh' '.githooks/*')
          echo "Checking ${#scripts[@]} scripts"
          docker run --rm -v "$PWD":/mnt:ro -w /mnt \
            koalaman/shellcheck:v0.10.0 -s bash "${scripts[@]}"

  pbx-converge:
    name: PBX converge tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for the per-context dialplan merge tool
        run: python3 -m unittest discover -s pbx/tests -v

      - name: Convergence smoke (capstone fragments are self-stable)
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          touch "$tmp/extensions_custom.conf"
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner capstone \
            --append from-internal-custom
          python3 pbx/asterisk_converge.py --target "$tmp/extensions_custom.conf" \
            --source pbx/asterisk/extensions_custom.conf --owner capstone \
            --append from-internal-custom --check

  # Zeus portal API client (add-on mode, Phase 2): stdlib client implementing
  # the zeus docs/portal-api.md contract. Tests mock urlopen — no network, no
  # Zeus, no .env required.
  zeus-client:
    name: Zeus portal API client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for the Zeus portal API client
        run: python3 -m unittest discover -s scripts/tests -v

  # Magnate entitlement gate for the dograh route sync: dry-runs the REAL
  # sync_dograh_routes.py --check through every gate state (standalone,
  # disabled, entitled, not-entitled, plan 404, unauthorized abort,
  # unreachable fail-open) against stubbed dograh/FreePBX/Magnate HTTP
  # servers and a fake `docker` — no PBX, no Magnate, no network required.
  dograh-sync-gate:
    name: Route sync Magnate gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dry-run every Magnate gate state
        run: python3 scripts/test_dograh_routes_gate.py

  # Cerulean tenant gate: the Authentik group-NAME → tenant-slug matching that
  # decides whether a signed-in user may use the control center at all (the
  # dashboard's own "no tenant here" gate). Pure stdlib — no FastAPI, no
  # Authentik, no .env required.
  dashboard-tenant-gate:
    name: Dashboard tenant gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for the tenant gate
        run: python3 -m unittest discover -s dashboard-backend/tests -v

  dashboard-build:
    name: Dashboard build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + production build (tsc && vite build)
        run: npm run build

  # Regression guard: user-facing hosts must never be localhost or docker
  # bridge IPs. setup.sh's old LAN-IP detector picked docker0's 172.17.0.1 and
  # baked it into .env, which leaked into every dashboard link, port host, and
  # the softphone STUN/TURN config; the dashboard's fallback data also shipped
  # docker-subnet (10.42.x) hosts. This job fails if any of that class of
  # value reappears in the files where it is never legitimate (comments and
  # historical changelog entries are fine, which is why the greps are scoped).
  config-guard:
    name: No docker-IP / localhost leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dashboard fallback data has no docker-bridge IPs or localhost links
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if grep -nE "10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.|http://localhost:[0-9]+" "$f"; then
              echo "::error file=$f::docker-bridge IP or localhost link in dashboard fallback data"
              bad=1
            fi
          done < <(git ls-files 'dashboard/src/**')
          exit $bad

      - name: Env template has no docker-bridge IPs outside comments
        run: |
          set -euo pipefail
          bad=0
          # Comment lines (e.g. the detector explainer in .env.example) may
          # mention 172.16.0.0/12 / 172.17.0.1 as examples; values may not.
          if hits=$(grep -nE '10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.' <(grep -vE '^\s*#' .env.example)); then
            echo "$hits"
            echo "::error file=.env.example::docker-bridge IP in env template value"
            bad=1
          fi
          exit $bad

      - name: Landing pages have no docker-bridge IPs or localhost links
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r f; do
            if grep -nE "10\.42\.|172\.(1[6-9]|2[0-9]|3[01])\.|http://localhost:[0-9]+" "$f"; then
              echo "::error file=$f::docker-bridge IP or localhost link in landing page"
              bad=1
            fi
          done < <(git ls-files 'web/**')
          exit $bad
