# Capstone — self-hosted Voice AI Agent Platform
# (dograh/Pipecat + local TTS/STT/LLM + n8n + Grist + Authentik + Prometheus/Grafana)
#
# Canonical single-file compose for the capstone repo. All services are 100%
# open-source and self-hosted — nothing calls a paid SaaS.
# NocoDB profile removed (Grist is the sole record store).
#
# Networking model (the ONE deliberate design decision):
#
#   • dograh-api runs with `network_mode: host` so it can bind its ARI
#     media sockets and reach the switch on the host's published 8088. It talks
#     to every other service through the host's published ports
#     (127.0.0.1:<port>). Use this when the switch runs on the SAME host,
#     which is every capstone install: cantus-switch publishes 8088 there.
#   • Everything else joins the `interview-net` bridge and talks by service
#     name; containers that must call back into host-mode dograh (or the LLM
#     gateway) use `host.docker.internal` (extra_hosts: host-gateway).
#
# Services: postgres/redis/minio (dograh's own DB/cache/storage), tts-shim
# (TTS, port 8881 — Piper; Kokoro retired behind the `kokoro` profile on 8880),
# speaches (STT, port 8001), OmniRoute LLM gateway on 20128,
# n8n + self-hosted AI-assistant sandbox
# (SearXNG), Grist (default dashboard), and the metrics-only observability
# trio (OTel collector → Prometheus → Grafana; nothing stores traces).
# The n8n Interview Grader workflow is auto-imported and activated at startup
# by the n8n-import service.
#
# LLM gateway on 20128: the MIT-licensed OmniRoute container
# (diegosouzapw/omniroute), OpenAI-compatible /v1. dograh (host mode) reaches it
# on 127.0.0.1:20128 and everything else through the SSO proxy in front of it on
# 20128 — the gateway's own port has no LAN binding, so 20128 is the one address
# that works from anywhere for /v1. Either way it is a single drop-in service
# for the whole stack.
#
# Run from THIS directory (all paths are relative to it):
#     cp .env.example .env      # set OSS_JWT_SECRET etc. first
#     docker compose up -d
#
# Port map (host)
# ───────────────
#  5432  postgres (dograh DB)            6379  redis (dograh)
#  9000  minio API                       9001  minio console
#  8000  dograh-api (host mode, original uvicorn port)  8088  Cantus control/ARI (on host)
#  3010  dograh-ui (Next.js web UI)
#  8881  tts-shim (local TTS — Piper)    8001  speaches (local Whisper STT)
#  8880  kokoro-fastapi (retired; opt-in via the `kokoro` profile)
#  20128 LLM gateway (OmniRoute)         5678  n8n
#  8090  Workflow Studio (browser UI for creating phone agents)
#  8484  Grist
#  3301  Grafana (held SigNoz's port)    4317/4318  OTel gRPC/HTTP ingest
#  9090  prometheus (the metrics store)  8888/8889  otel-collector metrics
#  8095  dashboard-api (control-panel aggregator)   8096  dashboard (Control Center UI)
#
# Binding policy: every web UI/API in this stack binds to 127.0.0.1 and is
# reachable only from this host or over the compose network by service name.
# The public door is the NPM edge, which forwards each subdomain to that app's
# oauth2-proxy gateway (see the SSO gateways below) — never to the app port.
# n8n reaches Grist as `http://grist:8484` on interview-net, and host-mode
# dograh reaches n8n on 127.0.0.1:5678, so neither needs a LAN binding.
# The only exceptions are the ports a LAN client genuinely dials: OmniRoute
# (20128, dialled by dograh-ui in the browser) and the Cantus plane
# (8088/tcp for control, ARI and the softphone; 7443-7444/udp for voice).
# dograh-api is host-mode (port 8000 — its original uvicorn port) and the
# dograh-ui (port 3010) published 0.0.0.0; both are only reachable on the LAN
# unless you reverse-proxy them (e.g. Nginx Proxy Manager).
# The switch is `cantus-switch` below: one container, no SIP, no RTP range.
# dograh's ARI endpoint is configured per-organization in the dograh UI.
# ─────────────────────────────────────────────────────────────────────────────

# Project name is pinned so container/volume names never depend on where this
# repo is checked out (the mesh puts it in 2-voice/capstone).
name: capstone

###############################################
# Authentik SSO gateways (oauth2-proxy)
###############################################
# Every service in this stack that has no OIDC of its own — n8n, Grist, Grafana,
# the Workflow Studio — is fronted by a real OIDC
# relying party instead of a password form: oauth2-proxy runs the browser
# through a code flow against Cerulean Authentik and only then proxies the app.
# There is no nginx auth_request and no Authentik outpost in the path.
#
# All of them share ONE session store (the platform's `cerulean-sso-sessions`
# redis on the edge host) and one `_innotel_sso` cookie on .innotel.us, so a
# single Authentik sign-in covers every gateway on the platform. See
# ips/docs/sign-in-posture.md.
#
# Three flags are load-bearing and were each measured, not guessed (see
# 1-primary/npm/docs/stack.md):
#   * --insecure-oidc-allow-unverified-email: Authentik's `email` scope mapping
#     sets email_verified: false and oauth2-proxy refuses such a token, so
#     without it every callback dies with HTTP 500.
#   * --oidc-groups-claim=groups: without it --allowed-group restricts nothing.
#   * --session-store-type=redis: a cookie session overflows 4KB, and the extra
#     Set-Cookie headers then overflow the edge's proxy_buffer_size, so the
#     callback that finishes the login answers 502.
#
# The NPM proxy host for each app forwards to the gateway's HOST port instead of
# the app's own; the app itself keeps its own port (several are still reachable
# on the LAN - see the sign-in posture document).
x-sso-gateway: &sso-gateway
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.2
  restart: unless-stopped
  logging:
    driver: json-file
  # Liveness. This image is distroless — one binary, no shell, no wget — so
  # there is nothing *inside* the container a healthcheck could execute: Docker
  # could only report the gateway as running with no health signal, and the
  # Control Center reads that as Warning. The probe is the static busybox the
  # `healthprobe` one-shot unpacks into `probe-bin`, and `/ping` is
  # oauth2-proxy's own unauthenticated liveness endpoint: it answers 200 "OK"
  # without touching the upstream or the session store.
  volumes:
    - probe-bin:/probe:ro
  depends_on:
    healthprobe:
      condition: service_completed_successfully
  healthcheck:
    test: ["CMD", "/probe/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4180/ping"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
  environment: &sso-gateway-env
    OAUTH2_PROXY_PROVIDER: oidc
    # Endpoints are explicit (no discovery). The issuer is the APP-SCOPED one,
    # because that is the value Authentik puts in the id_token's `iss`:
    # oauth2-proxy verifies `iss` against --oidc-issuer-url even with
    # --skip-oidc-discovery, so the bare base here makes every callback die with
    # `oidc: id token issued by a different provider` -> HTTP 500 on
    # /oauth2/callback (reproduced on v7.8.2).
    OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
    OAUTH2_PROXY_OIDC_ISSUER_URL: ${SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/${SSO_APP_SLUG:-innotel-app-gateway}/
    OAUTH2_PROXY_LOGIN_URL: ${SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/authorize/
    OAUTH2_PROXY_REDEEM_URL: ${SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/token/
    OAUTH2_PROXY_PROFILE_URL: ${SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/userinfo/
    OAUTH2_PROXY_OIDC_JWKS_URL: ${SSO_AUTHENTIK_BASE:-https://auth.cerulean.innotel.us}/application/o/${SSO_APP_SLUG:-innotel-app-gateway}/jwks/
    OAUTH2_PROXY_CLIENT_ID: ${SSO_CLIENT_ID:-innotel-app-gateway}
    OAUTH2_PROXY_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
    OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET:-}
    OAUTH2_PROXY_COOKIE_NAME: _innotel_sso
    OAUTH2_PROXY_COOKIE_DOMAINS: ${SSO_COOKIE_DOMAIN:-.innotel.us}
    OAUTH2_PROXY_COOKIE_SECURE: "true"
    OAUTH2_PROXY_COOKIE_SAMESITE: lax
    OAUTH2_PROXY_EMAIL_DOMAINS: "*"
    OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
    OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
    OAUTH2_PROXY_ALLOWED_GROUPS: ${SSO_REQUIRED_GROUP:-cerulean-platform}
    OAUTH2_PROXY_SCOPE: openid email profile groups
    OAUTH2_PROXY_SESSION_STORE_TYPE: redis
    # The session store runs on the EDGE host. While edge and stack shared a box
    # the gateway dialled the host-gateway alias (its own docker0); Capstone now
    # has a server of its own, so SSO_SESSION_REDIS_HOST names the edge host's
    # LAN address — the address the store is published on for exactly this case.
    # The alias stays as the fallback and is correct only on the edge host
    # itself: a gateway pointed at a docker0 that holds no store exits on
    # "dial tcp 172.17.0.1:16380: connect: connection refused" rather than
    # degrading. extra_hosts below supplies the alias; a literal gateway IP is
    # what the CI addressing policy forbids in service targets.
    OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://:${SSO_SESSION_REDIS_PASSWORD:-}@${SSO_SESSION_REDIS_HOST:-host.docker.internal}:${SSO_SESSION_REDIS_PORT:-16380}/0
    OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
    OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
    OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    OAUTH2_PROXY_REVERSE_PROXY: "true"
    OAUTH2_PROXY_PASS_USER_HEADERS: "true"
    OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    OAUTH2_PROXY_WHITELIST_DOMAINS: ${SSO_COOKIE_DOMAIN:-.innotel.us}
  # The host-gateway alias every SSO gateway dials host-published services
  # through (session store, Technitium console). It resolves to this host's
  # docker0 gateway, so the target stays correct without naming a bridge IP.
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # ── Probe tools for the distroless services ───────────────────────────────
  # The SSO gateways (oauth2-proxy) and `otel-collector` run single-binary
  # distroless images: no sh, no libc, no wget — a healthcheck had nothing to
  # run in them, so the daemon could only report them as running with no health
  # signal and the Control Center showed them Warning. This one-shot unpacks a
  # *static* busybox into the `probe-bin` volume (the same
  # one-shot-into-a-volume pattern as `sandbox-certs` → `sandbox-tls`); each
  # consumer mounts it read-only at /probe and wgets its own loopback health
  # endpoint. It runs, copies, exits 0 — so it is excluded from the Control
  # Center like the other one-shots (dashboard-backend/app/main.py ONE_SHOT).
  healthprobe:
    # The :debug flavour of distroless is where that static busybox lives (the
    # runtime flavour has no files at all), and it is static by construction:
    # it runs in a libc-less image, which is exactly what the consumers are.
    image: ${HEALTHPROBE_IMAGE:-gcr.io/distroless/static-debian12:debug}
    container_name: capstone-healthprobe
    restart: "no"
    entrypoint: ["/busybox/busybox", "cp", "/busybox/busybox", "/probe/busybox"]
    volumes:
      - probe-bin:/probe
    networks: [interview-net]

  # ── dograh core ──────────────────────────────────────────────────────────
  postgres:
    # dograh-api blocks on all three of postgres/redis/minio; without a restart
    # policy a stop (a host reboot, an OOM, a `compose down` of one service)
    # left it crash-looping on ConnectionRefused with every other service green.
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — dograh (host mode) reaches it on 127.0.0.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [interview-net]

  redis:
    restart: unless-stopped
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redissecret}"]
    ports:
      - "127.0.0.1:6379:6379"   # loopback only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks: [interview-net]

  minio:
    restart: unless-stopped
    # Mirrored into this repo's GHCR namespace by the release pipeline
    # (.github/workflows/release.yml). Upstream MinIO no longer serves
    # anonymous pulls from anywhere public — docker.io `minio/minio` is gone
    # (404) and quay.io `minio/minio` answers 401 — so the mirror is built from
    # the maintained community CE build `pgsty/minio` and republished under the
    # plain RELEASE tag. Override with MINIO_IMAGE in .env for a different build.
    image: ${MINIO_IMAGE:-ghcr.io/innotelinc/capstone/minio:RELEASE.2026-08-04T00-00-00Z}
    # Memory posture (docs/service-audit.md): cap the object store so a media
    # burst can't crowd out the agent pipeline. memswap = mem (no swap spill).
    mem_limit: 1g
    memswap_limit: 1g
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9200:9000"   # loopback only; 9000 on the host is Cerulean Authentik
      - "127.0.0.1:9201:9001"
      # Also reachable on the LAN plane (same convention as the switch's ports
      # below). The remote NPM edge serves /voice-audio out of this bucket —
      # browsers fetch recordings/transcripts straight from MinIO through that
      # route — and the edge can only reach the host's LAN address, never its
      # loopback. See npm-proxy-hosts.py MEDIA_* and MINIO_PUBLIC_ENDPOINT.
      - "${PJSIP_MEDIA_ADDRESS:-192.168.1.30}:9200:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interview-net]

  # dograh-api in HOST mode: binds ARI/telephony sockets and reaches the PBX on
  # loopback. All DB/cache/storage/TTS/LLM/OTel endpoints are 127.0.0.1:port.
  # DEPLOYMENT_MODE defaults to "oss", which is what lets it point model
  # services at localhost URLs — set it explicitly so it can never flip.
  dograh-api:
    # Upstream dograh platform image, published to GitHub's container registry.
    # If it isn't published, setup.sh builds from the dograh source clone
    # (docker-compose.dograh-build.yml). Override via DOGRAH_API_IMAGE.
    image: ${DOGRAH_API_IMAGE:-ghcr.io/innotelinc/dograh-api:latest}
    container_name: dograh-api
    network_mode: host
    restart: unless-stopped
    environment:
      ENVIRONMENT: "local"
      DEPLOYMENT_MODE: "oss"
      LOG_LEVEL: "INFO"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?set OSS_JWT_SECRET in your .env}"
      # dograh-api binds uvicorn on UVICORN_BASE_PORT (its default is 8000).
      # Host mode = it listens on the host directly at 0.0.0.0:8000.
      UVICORN_BASE_PORT: "8000"

      # Public origin. For the n8n transcript fetch to work, BACKEND_API_ENDPOINT
      # must be reachable from INSIDE the n8n container: use the host LAN IP or a
      # public URL, NOT localhost (n8n would resolve localhost to itself).
      # The .env carries the detected LAN IP (e.g. http://192.168.1.63:8000).
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"

      # ── Authentication ─────────────────────────────────────────────────
      # 'oidc' = sign in exclusively through Cerulean (Authentik). Local
      # password routes 404 in this mode — there is deliberately no
      # break-glass. The client secret is held by the API only.
      AUTH_PROVIDER: "${AUTH_PROVIDER:-local}"
      AUTHENTIK_ISSUER_URL: "${AUTHENTIK_ISSUER_URL:-}"
      AUTHENTIK_CLIENT_ID: "${AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${AUTHENTIK_CLIENT_SECRET:-}"
      AUTHENTIK_REDIRECT_URI: "${AUTHENTIK_REDIRECT_URI:-}"
      AUTHENTIK_POST_LOGIN_REDIRECT: "${AUTHENTIK_POST_LOGIN_REDIRECT:-}"
      AUTHENTIK_ADMIN_EMAILS: "${AUTHENTIK_ADMIN_EMAILS:-}"
      AUTHENTIK_ALLOWED_EMAILS: "${AUTHENTIK_ALLOWED_EMAILS:-}"
      # Group gate: any Authentik identity carrying one of these groups (from
      # the 'groups' scope) is admitted alongside the email allowlist.
      AUTHENTIK_ALLOWED_GROUPS: "${AUTHENTIK_ALLOWED_GROUPS:-}"
      AUTHENTIK_ORGANIZATION_PROVIDER_ID: "${AUTHENTIK_ORGANIZATION_PROVIDER_ID:-}"
      # Dograh's hosted model service is not used: this stack runs its own models
      # (OmniRoute, Piper, Speaches), its own ARI telephony against the switch
      # service keys. Upstream still defaults MPS_API_URL to
      # https://services.dograh.com and calls it on the first authenticated
      # request of a new organization; the local discard port keeps that call on
      # this host and fails instantly if anything ever reaches it.
      MPS_API_URL: "${MPS_API_URL:-http://127.0.0.1:9}"

      # Host-mode URLs for the bridge services
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redissecret}@127.0.0.1:6379"
      MINIO_ENDPOINT: "127.0.0.1:9200"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"
      # Signed/plain URLs for transcripts & recordings must be reachable from
      # the n8n container (it fetches transcript_url). Upstream expects nginx to
      # proxy /voice-audio/ to MinIO; locally we point straight at MinIO on the
      # shared interview-net bridge. The bucket has anonymous read access, so
      # no signature is needed (see services/filesystem/minio.py).
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-http://minio:9000}"

      # ARI is configured per-organization in the dograh UI (ari_endpoint etc.),
      # not via env. Point it at the PBX LAN IP (http://192.168.x.x:8088) — 8088
      # has no loopback leg (README → Addressing).
      ENABLE_ARI_MANAGER: "true"
      ENABLE_ARI_STASIS: "true"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "false"
      # On the Zeus shared voice plane, a completed interview channel is
      # redirected to [zeus-ai-return] instead of being deleted. Keep this
      # false for standalone Capstone; set it on the shared Zeus deployment
      # only after the Zeus dialplan and VOICE_CONTEXT_SECRET are configured.
      ZEUS_RETURN_ENABLED: "${ZEUS_RETURN_ENABLED:-false}"

      # ── OpenTelemetry → the stack's collector ─────────────────────────────
      # Standard OTel SDK auto-config vars (used by any exporter that reads them)
      OTEL_SERVICE_NAME: "dograh-interview-agent"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_METRICS_EXPORTER: "otlp"
      # No log pipeline exists in the metrics-only collector; exporting them
      # only produced per-batch drop warnings. Traces + metrics are the surfaces.
      OTEL_LOGS_EXPORTER: "none"
      # dograh's tracing_config.py builds its default exporter from this var
      # (wired in api/constants.py + api/services/pipecat/tracing_config.py):
      # spans go to the OTel collector instead of being dropped when no Langfuse
      # creds are set. The name is the fork's, not SigNoz's — the collector
      # converts each span to a RED histogram and drops the span. See README
      # "Observability wiring".
      SIGNOZ_OTLP_ENDPOINT: "http://127.0.0.1:4318/v1/traces"

      # ── Call length ───────────────────────────────────────────────────────
      # Upstream dograh hard-codes a 300 s per-workflow call cap (and a 1200 s
      # ceiling) unless the workflow sets max_call_duration. The cap cut real
      # interviews off mid-call, so the fork makes both numbers deployment
      # settings and treats 0 as "no time limit"; a workflow that sets its own
      # max_call_duration (e.g. the mock interviews) still wins.
      #
      # MAX_CALL_DURATION_SECONDS is the ceiling a workflow may request: 0
      # removes it, so interview workflows can ask for unlimited calls.
      # STALE_CALL_TIMEOUT_SECONDS is the concurrency rate limiter's slot age-out
      # and must stay >= the longest call you allow, or a live call's slot is
      # purged and the org concurrency limit under-counts.
      DEFAULT_MAX_CALL_DURATION_SECONDS: "${DEFAULT_MAX_CALL_DURATION_SECONDS:-300}"
      MAX_CALL_DURATION_SECONDS: "${MAX_CALL_DURATION_SECONDS:-0}"
      STALE_CALL_TIMEOUT_SECONDS: "${STALE_CALL_TIMEOUT_SECONDS:-7200}"
    # Host-mode FastAPI on 8000; probe the same health endpoint smoke-test.sh uses.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  # ── Dograh web UI (Next.js frontend) ─────────────────────────────────────
  # The dograh platform ships a separate Next.js UI (published to GHCR).
  # dograh-api runs HOST mode on its original uvicorn port (8000); the UI is
  # published on host port 3010 and reaches the API back via
  # host.docker.internal:8000. From the browser, the API is reached at
  # PUBLIC_BASE_URL (LAN IP :8000).
  dograh-ui:
    image: ${DOGRAH_UI_IMAGE:-ghcr.io/innotelinc/dograh-ui:latest}
    container_name: dograh-ui
    restart: unless-stopped
    environment:
      # Bind the Next.js standalone server to all interfaces
      HOSTNAME: "0.0.0.0"
      PORT: "3010"
      # Server-side URL (SSR, inside docker) → host-mode dograh-api
      BACKEND_URL: "${DOGRAH_UI_BACKEND_URL:-http://host.docker.internal:8000}"
      NODE_ENV: "oss"
      ENABLE_TELEMETRY: "${DOGRAH_UI_ENABLE_TELEMETRY:-false}"
    ports:
      - "0.0.0.0:3010:3010"   # UI on 3010 — API owns 8000
    depends_on:
      dograh-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3010 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [interview-net]

  # ── TURN server for WebRTC/media traversal ────────────────────────────────
  # Coturn uses static credentials from .env and a dedicated relay range that
  # does not collide with cantus-switch (8088/tcp, 7443-7444/udp).
  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    profiles: ["standalone"]  # Only start when Capstone runs alone (Zeus coturn is primary)
    restart: unless-stopped
    command:
      - turnserver
      - --no-tls
      - --fingerprint
      - --lt-cred-mech
      # STUN is OFF on purpose. TURN is authenticated (--lt-cred-mech), but a
      # bare STUN Binding request is unauthenticated *by design*, so an open
      # 3478 on the WAN is a public STUN reflector — which is what happened on
      # the shared box (an internet scanner drove it as one). No switch needs it
      # any more either: cantus-switch learns its reachable address from its own
      # probe/report exchange rather than STUN, so --no-stun costs the voice
      # plane nothing. Browsers get their server-reflexive candidates from the
      # TURN allocation itself. TURN relay is untouched; a satellite stack that
      # shares this host keeps the same flag — keep the two in step.
      - --no-stun
      - --user=${TURN_USERNAME:-turnuser}:${TURN_PASSWORD:-change-me-turn-password}
      - --realm=${TURN_REALM:-turn.example.com}
      - --listening-port=3478
      - --min-port=${TURN_RELAY_PORT_START:-49152}
      - --max-port=${TURN_RELAY_PORT_END:-49251}
      - --listening-ip=0.0.0.0
      # Public address coturn advertises for relayed candidates. Behind Docker
      # NAT it cannot discover this itself, so it must be told — and a pinned
      # address silently rots when the WAN IP changes (relay candidates then
      # point at an address nobody can reach and calls carry no audio).
      #
      # The coturn image's entrypoint eval()s each argument and ships
      # detect-external-ip (a DNS query that returns the caller's public IP),
      # so this is detected on every container start. Pin TURN_EXTERNAL_IP in
      # .env only for a box where the DNS probe is blocked.
      - --external-ip=${TURN_EXTERNAL_IP:-$(detect-external-ip)}
      - --log-file=stdout
      - --simple-log
    environment:
      TURN_USERNAME: "${TURN_USERNAME:-turnuser}"
      TURN_PASSWORD: "${TURN_PASSWORD:-change-me-turn-password}"
      TURN_REALM: "${TURN_REALM:-turn.example.com}"
      TURN_RELAY_PORT_START: "${TURN_RELAY_PORT_START:-49152}"
      TURN_RELAY_PORT_END: "${TURN_RELAY_PORT_END:-49251}"
      TURN_EXTERNAL_IP: "${TURN_EXTERNAL_IP:-127.0.0.1}"
    ports:
      - "${TURN_LISTENING_PORT:-3478}:3478/udp"
      - "${TURN_LISTENING_PORT:-3478}:3478/tcp"
      - "${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}:${TURN_RELAY_PORT_START:-49152}-${TURN_RELAY_PORT_END:-49251}/udp"
    # Image has bash but no curl/wget/python — a raw TCP connect proves the
    # TURN listener is up.
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3478' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [interview-net]
    # Note: this is Capstone's own coturn only. When the stack consumes a
    # shared voice plane (CAPSTONE_PBX names another host), that host already
    # runs a production coturn and Capstone uses it through the TURN_* env vars
    # rather than starting its own. See docs/zeus-integration.md §4 and .env
    # TURN_EXTERNAL_IP.

  # ── Local TTS: Kokoro-82M via kokoro-fastapi (OpenAI-compatible) ──────────
  # RETIRED as of v3.21 — behind the `kokoro` profile, so a plain `up` does not
  # start it. Piper is the local voice now (in-process ONNX in `tts-shim`,
  # ~2.5× faster here and no ~4 GiB torch boot). Start this only to A/B against
  # Piper: `docker compose --profile kokoro up -d kokoro` (and list `kokoro` in
  # TTS_SHIM_ENGINES).
  kokoro:
    profiles: ["kokoro"]
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:latest}
    container_name: kokoro-fastapi
    restart: unless-stopped
    # Memory posture: Kokoro-82M on CPU peaks ~1.5 GiB during synthesis, but
    # the full boot (torch + model + voice packs + inno tuner) transiently
    # overshoots even 4 GiB and gets OOM-killed (exit 137) — give the boot
    # plenty of headroom; steady-state after load is ~2-3 GiB.
    #
    # MEASURED 2026-10-12 — this host can no longer provide that headroom, so
    # this container crash-loops (54+ restarts, ~40-90 s apart) and the reboot
    # churn starves the switch too: dograh's ARI handshake began timing out,
    # it parked its telephony configuration (`ari-timeout`, "Deactivated config
    # 2 after 20 consecutive failures") and inbound calls stopped reaching the
    # agent entirely. The numbers: the cgroup ceiling here is memory.max = 5.5
    # GiB and memory.current sits at 5.18 GiB — ~0.3 GiB free — while
    # /etc/systemd/system/capstone.service still documents this box as 2 cores /
    # 7.3 GiB, i.e. ~1.8 GiB of the sizing decision is gone. The kill is at the
    # host cgroup, not this one: the container's own memory.events stays
    # oom_kill 0 (sampled peak ~1 GiB) while dockerd reports `oom` + exit 137.
    # mem_limit cannot be the fix, because 8g is already inert under a 5.5 GiB
    # ceiling. Fix the ceiling (or move TTS off this box, or point tts-shim at
    # its bundled Piper engine) — not this value.
    #
    # NOT AVAILABLE HERE: this image is PyTorch-only. v0.9.0 (the pinned
    # `latest`) ships no `onnxruntime` and no ONNX inference path at all — the
    # model on disk is `kokoro-v1_0.pth` and the loader is `kokoro.KModel` — so
    # installing onnxruntime into this image would be inert. The ONNX Kokoro on
    # this box is `speaches` (`speaches-ai/Kokoro-82M-v1.0-ONNX`, onnxruntime
    # 1.22), and tts-shim can dial it instead: see TTS_SHIM_KOKORO_MODEL above
    # and scripts/install-onnx-kokoro.sh.
    mem_limit: 8g
    memswap_limit: 8g
    # Torch/OpenMP size their thread pools (and thread-local arenas) from the
    # core count; on an 8-core host that multiplies the load-time allocation
    # spike past even 6 GiB. Two threads per pool kept the boot allocation
    # bounded, but it also pinned synthesis to two of the host's eight cores,
    # where one interview-sized sentence took ~5-9 s to generate ~7 s of audio
    # (RTF ~1.25) — slower than playback, so the caller heard the audio
    # underrun. Four threads measured 2.3x faster (3.0-3.5 s, RTF ~0.48) and
    # still boots clean at ~1.1 GiB steady-state. The spike scales with the
    # pool, so raise this further only against a measurement, not a core count.
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      KMP_INIT_AT_FORK: "FALSE"
      KMP_AFFINITY: "granularity=fine,compact,1,0"
    # GPU? Use ghcr.io/remsky/kokoro-fastapi-gpu:latest and add:
    #   deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [gpu] } ] } } }
    # The image bakes in kokoro-v1.0.onnx + voices (entrypoint serves :8880).
    ports:
      - "127.0.0.1:8880:8880"   # loopback only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8880/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [interview-net]

  # ── TTS shim: one OpenAI-compatible door in front of the TTS engines ──────
  # Speaks exactly what pipecat's SpeachesTTSService dials — POST
  # /v1/audio/speech, response_format=pcm, s16le mono at 24 kHz — so dograh is
  # pointed at it with a model-configuration change and no fork patch. Behind
  # the door: a second engine for A/B, and a synthesized-audio cache, because
  # the interview script is fixed text re-spoken on every call and upstream's
  # cache covers recordings/ambient noise only. See tts-shim/README.md.
  tts-shim:
    build:
      context: ./tts-shim
      args:
        WITH_PIPER: "${TTS_SHIM_WITH_PIPER:-1}"
    image: ${TTS_SHIM_IMAGE:-capstone-tts-shim:local}
    container_name: tts-shim
    restart: unless-stopped
    # Memory posture: the cache is on a volume and the engines are in-process
    # (Piper) or remote (Kokoro), so the process itself stays small.
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      # Which engines exist. An engine left out is neither advertised nor
      # selectable — a request naming it gets a 503 rather than another engine's
      # audio, which is what makes an A/B test honest. `.env` decides: this host
      # serves Kokoro `af_heart` (`kokoro,piper`, Kokoro the default) and can
      # fall back to Piper with one edit; the standalone default stays `piper`
      # because it is the engine that holds real time on a small CPU box.
      TTS_SHIM_ENGINES: "${TTS_SHIM_ENGINES:-piper}"
      TTS_SHIM_DEFAULT_ENGINE: "${TTS_SHIM_DEFAULT_ENGINE:-piper}"
      # Only read when `kokoro` is in TTS_SHIM_ENGINES (see scripts/install-onnx-kokoro.sh).
      # The name has to resolve FROM THE SHIM: these two services are on this
      # compose file's network in the standalone layout, and on the voice
      # platform's own project network when that runs as a separate project —
      # where `speaches`/`kokoro-fastapi` do not resolve from here ("Temporary
      # failure in name resolution" in the shim log) and the engine cannot work.
      TTS_SHIM_KOKORO_URL: "${TTS_SHIM_KOKORO_URL:-http://kokoro-fastapi:8880}"
      # The model id the kokoro upstream is asked for. kokoro-fastapi ignores it;
      # an upstream that hosts more than one model does not — the ONNX Kokoro
      # lives in `speaches` and answers to `speaches-ai/Kokoro-82M-v1.0-ONNX`, so
      # pair it with TTS_SHIM_KOKORO_URL=http://speaches:8000 (and that model has
      # to be installed there: an empty /v1/models is not an upstream).
      TTS_SHIM_KOKORO_MODEL: "${TTS_SHIM_KOKORO_MODEL:-kokoro}"
      # Voice when the request sends none (or a Piper-style name the Kokoro
      # upstream would reject). af_heart is Kokoro v1.0's own default voice.
      TTS_SHIM_KOKORO_VOICE: "${TTS_SHIM_KOKORO_VOICE:-af_heart}"
      TTS_SHIM_PIPER_VOICE: "${TTS_SHIM_PIPER_VOICE:-}"
      TTS_SHIM_CACHE_ENABLED: "${TTS_SHIM_CACHE_ENABLED:-true}"
      TTS_SHIM_CACHE_MAX_BYTES: "${TTS_SHIM_CACHE_MAX_BYTES:-536870912}"
      TTS_SHIM_SAMPLE_RATE: "24000"
    ports:
      # 8881 on the host: 8880 is kokoro-fastapi's own loopback port.
      - "127.0.0.1:8881:8880"   # loopback only
    volumes:
      - tts_shim_cache:/var/cache/tts-shim
      # Piper voice packs (.onnx + .onnx.json). On a volume rather than in the
      # image so a voice is a data decision, not a rebuild: fetch one with
      # `docker exec tts-shim python -m piper.download_voices <voice>`.
      - tts_piper_voices:/opt/piper-voices
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8880/health', timeout=5)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interview-net]

  # ── Local STT: Speaches (faster-whisper, OpenAI-compatible) ──────────────
  # dograh's native "speaches" STT provider points here (base_url …/v1). Host
  # Host port 8001 (dograh-api is host-mode on 8000, so 8001 stays free of
  # conflicts). First start downloads
  # the Whisper model into speaches_models (one-time); after that it's fully
  # offline. GPU: use ghcr.io/speaches-ai/speaches:latest-cuda and set
  # SPEACHES_WHISPER_DEVICE=cuda (+ deploy.resources.reservations.devices).
  speaches:
    image: ${SPEACHES_IMAGE:-ghcr.io/speaches-ai/speaches:latest-cpu}
    container_name: speaches
    restart: unless-stopped
    # Memory posture: faster-whisper (small/int8) peaks ~1.5 GiB.
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      WHISPER__INFERENCE_DEVICE: "${SPEACHES_WHISPER_DEVICE:-cpu}"      # cpu | cuda | auto
      WHISPER__COMPUTE_TYPE: "${SPEACHES_WHISPER_COMPUTE_TYPE:-int8}"
      WHISPER__MODEL: "${SPEACHES_WHISPER_MODEL:-Systran/faster-distil-whisper-small.en}"
      UVICORN_HOST: "0.0.0.0"
      UVICORN_PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"   # loopback only
    volumes:
      - speaches_models:/home/ubuntu/.cache/huggingface/hub   # cached models → offline runtime
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks: [interview-net]

  # ── LLM gateway: OmniRoute — NOT DEFINED HERE (moved 2026-09-28) ──────────
  # The gateway, the Authentik-fronted proxy in front of it and that proxy's
  # session store are one standalone stack now: `ips/extensions/llm/`
  # (`docker-compose.host.yml`, project `innotel-gateway`), running on i1's
  # `proxy` container (`.71`). Consumers dial the door —
  # `http://192.168.1.71:20128/v1` — and the gateway's own `:20128` binding stays
  # on that host's loopback and docker0.
  #
  # The `omniroute` service used to live here behind `profiles: ["gateway"]`, and
  # that is exactly the split that made this stack look like the gateway's owner
  # while `5-dev/olympus` declared the proxy: two files, two hosts, one thing to
  # move. It is gone for the reason the profile existed — a second gateway started
  # from an app host answers like a working one while holding *zero* provider
  # connections (measured: `provider_connections`=0, every key `401
  # invalid_api_key`), so the wrong configuration should be impossible to start
  # rather than detectable afterwards. `GATEWAY_DO_NOT_START_ME_HERE` below is how
  # the footgun fails instead of starting.
  #
  # `ips/scripts/check-gateway-targets.py` fails any target that still names the
  # old host, and no longer counts this file as one that declares the gateway —
  # which is what used to let a stale `host.docker.internal:20128` here read as
  # legitimate (see the two defaults it is guarding).
  GATEWAY_DO_NOT_START_ME_HERE:
    # Keep this here, and keep it out of the way: `docker compose --profile
    # retired up` no longer starts a gateway, because the image, the container
    # name and the ports are all gone. Anything that tries fails at once and says
    # why. Delete the stanza only when something else carries the pointer above.
    profiles: ["retired"]
    image: python:3.12-alpine
    restart: "no"
    command:
      - sh
      - -c
      - |
        echo "capstone: the OmniRoute gateway is not defined here any more." >&2
        echo "It is the standalone stack in ips/extensions/llm/ on i1 .71." >&2
        echo "See the comment in 2-voice/capstone/docker-compose.yml." >&2
        exit 2


  # ── Workflow automation: n8n (Community Edition) ──────────────────────────
  n8n:
    # Custom image: adds OpenTelemetry auto-instrumentation (see n8n.Dockerfile)
    # so the grading workflow's LLM call exports spans to the collector.
    build:
      context: .
      dockerfile: n8n.Dockerfile
    image: ${N8N_IMAGE:-capstone-n8n-otel:local}
    pull_policy: missing
    container_name: n8n
    restart: unless-stopped
    # Memory posture: workflow runs are bursty; NODE_OPTIONS (in the env block
    # below) caps the V8 heap so a runaway workflow is OOM-killed inside the
    # container, not the host.
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      # 127.0.0.1 — host-mode dograh posts its webhook events to
      # 127.0.0.1:5678, and the public door is n8n.<domain> → n8n-sso (14010).
      - "127.0.0.1:5678:5678"
    environment:
      NODE_OPTIONS: --max-old-space-size=768
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: "${N8N_EDITOR_BASE_URL:-http://localhost:5678/}"
      WEBHOOK_URL: "${N8N_WEBHOOK_URL:-http://localhost:5678/}"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The Interview Grader workflow reads GRIST_DOC_ID via $env; n8n 2.x
      # denies env access in expressions unless this is explicitly enabled.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GENERIC_TIMEZONE: "${N8N_TIMEZONE:-UTC}"
      # Headless owner provisioning (auto-creates the owner on first start, so
      # the workflow can be imported/activated via the n8n CLI without the UI).
      N8N_USER_MANAGEMENT_JWT_SECRET: "${N8N_USER_MANAGEMENT_JWT_SECRET:-change-me-in-env}"
      OWNER_EMAIL: "${N8N_OWNER_EMAIL:-admin@localhost}"
      OWNER_PASSWORD: "${N8N_OWNER_PASSWORD:-admin123}"
      OWNER_FIRST_NAME: "Interview"
      OWNER_LAST_NAME: "Admin"
      # Created by the Grist bootstrap step (scripts/grist_bootstrap.py). The
      # default is the bootstrapped doc for this repo — override in .env with
      # `GRIST_DOC_ID=$(python3 scripts/grist_bootstrap.py)` output. The doc is
      # owned by the Grist user, so the grader authenticates its writes with
      # GRIST_API_KEY (a key for that user).
      #
      # GRIST_API_KEY is matched PLAINTEXT against Grist's `users.api_key`
      # column (HomeDB) — create it in Grist's UI (Profile → API Keys) or set
      # it directly there. A stale/mismatched key makes the grader's final
      # Grist write 401 while every earlier node succeeds; the smoke test
      # exercises this via POST /webhook/interview-graded.
      GRIST_DOC_ID: "${GRIST_DOC_ID:-new~w8ixnSUpaAEGjaH9BE7636}"
      GRIST_API_KEY: "${GRIST_API_KEY:-}"
      # API key for the OpenAI-compatible OmniRoute gateway on 20128. setup.sh
      # mints this automatically and persists it in .env.
      # OpenTelemetry → the collector (bootstrap in n8n.Dockerfile reads these)
      OTEL_SERVICE_NAME: "n8n"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"

      # ── n8n AI Assistant (self-hosted, open-source) ───────────────────────
      # instance-ai module + locally-run sandbox (n8n-sandbox) + SearXNG search.
      # The model is served by OmniRoute (OpenAI-compatible /v1); model "auto"
      # routes across its free/connected providers.
      #
      # 20128, NOT 20128. 20128 is the gateway's own port and it is published on
      # loopback + this host's docker0 only — no LAN binding, because
      # `make gateway-auth-mode` leaves the gateway with no login of its own and
      # the reachability of that port is then the entire control (see the ports
      # block under `omniroute`). 20128 is the oauth2-proxy in front of it, which
      # exempts /v1 precisely so inference clients are unaffected. Through the
      # alias this is correct on the host running that proxy; a stack on another
      # host pins the LAN address of that host in .env instead, because the alias
      # resolves to *its own* docker0 where nothing listens.
      N8N_ENABLED_MODULES: "${N8N_ENABLED_MODULES:-instance-ai}"
      N8N_INSTANCE_AI_MODEL: "${N8N_INSTANCE_AI_MODEL:-auto}"
      N8N_INSTANCE_AI_MODEL_URL: "${N8N_INSTANCE_AI_MODEL_URL:-http://192.168.1.71:20128/v1}"
      N8N_INSTANCE_AI_MODEL_API_KEY: "${N8N_INSTANCE_AI_MODEL_API_KEY:-omniroute}"
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: "n8n-sandbox"
      N8N_INSTANCE_AI_SANDBOX_API_URL: "http://sandbox-api:8080"
      N8N_INSTANCE_AI_SANDBOX_API_KEY: "${SANDBOX_API_KEYS:-change-me-sandbox-api-key}"
      N8N_INSTANCE_AI_SANDBOX_IMAGE: "ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest"
      N8N_INSTANCE_AI_SEARXNG_URL: "http://searxng:8080"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-grader-workflow.json:/workflows/n8n-grader-workflow.json:ro
    # Lets n8n call host-mode dograh (8000) and OmniRoute (20128).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      sandbox-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      # First boot is slow (fresh DB migrations + instance-ai module init, made
      # worse while compose is still pulling/building the rest of the stack); a
      # 30s grace period used to mark n8n unhealthy mid-boot, which made
      # n8n-import's `depends_on: service_healthy` abort the whole `up`. Give
      # it 5 minutes to come up before the healthcheck starts counting.
      start_period: 300s
    networks: [interview-net]

  # Imports + publishes + activates the Interview Grader workflow on startup AND
  # restarts n8n so the production webhook actually registers (n8n 2.x only picks
  # up publish/activate after a restart — otherwise dograh's hang-up POST 404s).
  # See scripts/n8n-import.sh for the full sequence + webhook verification.
  n8n-import:
    image: ${N8N_IMAGE:-capstone-n8n-otel:local}
    container_name: n8n_import
    restart: "no"
    # Root so the one-shot can restart n8n via the mounted docker socket (the
    # image's default `node` user can't read root:docker 660 /var/run/docker.sock).
    user: "root"
    entrypoint: ["/bin/sh", "/workflows/n8n-import.sh"]
    environment:
      N8N_CONTAINER: n8n
      DOCKER_HOST_SOCK: /var/run/docker.sock
      N8N_PROBE_URL: "http://n8n:5678/"   # in-container probe target (n8n service)
      # This one-shot runs as root (needed for the docker-socket restart), so
      # n8n's default user folder would be /root/.n8n — a DIFFERENT database than
      # the one the n8n server reads (/home/node/.n8n via the n8n_data volume).
      # Pin the user folder (n8n appends ".n8n" itself) so the CLI imports into
      # the same DB the server uses.
      N8N_USER_FOLDER: /home/node
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-grader-workflow.json:/workflows/n8n-grader-workflow.json:ro
      - ./scripts/n8n-import.sh:/workflows/n8n-import.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock   # lets the one-shot restart n8n
    networks: [interview-net]

  # ── n8n AI Assistant sandbox stack (self-hosted; see docs.n8n.io …/set-up-ai-assistant).
  # sandbox-certs generates mTLS certs once, sandbox-api is the control plane n8n
  # talks to, sandbox-runner-1 is a privileged DinD runner that creates the actual
  # execution sandboxes, and searxng provides web search. None of these publish
  # ports to the host — n8n reaches them by service name over interview-net.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    container_name: n8n-sandbox-certs
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: "1"
    volumes:
      - sandbox-tls:/tls
    networks: [interview-net]

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:latest
    container_name: n8n-sandbox-api
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: "${SANDBOX_API_KEYS:-change-me-sandbox-api-key}"
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: "${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:-change-me-runner-registration-token}"
      SANDBOX_API_RUNNER_API_KEY: "${SANDBOX_API_RUNNER_API_KEY:-change-me-runner-key}"
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [interview-net]

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:latest
    container_name: n8n-sandbox-runner-1
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: "${SANDBOX_API_RUNNER_API_KEY:-change-me-runner-key}"
      SANDBOX_RUNNER_REGISTRATION_TOKEN: "${SANDBOX_API_RUNNER_REGISTRATION_TOKEN:-change-me-runner-registration-token}"
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      # The runner image's HTTP listener on :8080 is TLS-only (cert SANs
      # sandbox-runner-1/localhost, signed by the bootstrap CA) — advertise
      # https so registrations and sandbox-api match reality.
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ":9091"
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:latest
      # This kernel images ship with no loadable br_netfilter, so the nested
      # dockerd can't set bridge netfilter rules; ignore that (harmless here).
      DOCKER_IGNORE_BR_NETFILTER_ERROR: "1"
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      # The runner's control HTTP listener answers /healthz only after the
      # registration stream is established (heartbeats flowing) — a real
      # liveness signal for the dashboard. The :8080 listener is TLS-only now
      # (cert SANs are sandbox-runner-1/localhost), so probe it over https
      # with cert verification off (BusyBox wget has no --ca-certificate).
      test: ["CMD-SHELL", "wget -qO- -T 5 --no-check-certificate https://localhost:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [interview-net]

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET:-change-me-searxng-secret}"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider -T 5 http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [interview-net]

  # ── Workflow Studio: browser UI for creating phone agents ────────────────
  # Wraps scripts/generate_dograh_workflow.py: describe an agent in plain
  # English, the OmniRoute gateway expands it into a dograh workflow, preview
  # the JSON, then import it into dograh and register the next free extension
  # — all from the browser. Stdlib-only Python (no pip deps).
  workflow-studio:
    build:
      context: .
      dockerfile: workflow-studio.Dockerfile
    image: ${WORKFLOW_STUDIO_IMAGE:-capstone-workflow-studio:local}
    pull_policy: missing
    container_name: workflow-studio
    restart: unless-stopped
    ports:
      # 127.0.0.1 — the public door is workflow.<domain> → workflow-sso (14013).
      - "127.0.0.1:8090:8090"
    environment:
      PORT: "8090"
      # The gateway + dograh are reached through the host (dograh-api is host
      # mode); the UI container itself is on the bridge.
      DOGRAH_API_ENDPOINT: "http://host.docker.internal:8000"
      DOGRAH_API_TOKEN: "${DOGRAH_API_TOKEN:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # Stdlib-only image (no curl/wget) — probe with python urllib like
      # dashboard-api does. The UI serves / with 200 when the server is up.
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8090/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [interview-net]

  # ── Authentik — identity provider + SSO (auth.<domain>) ─────────────────
  # NOTE: this stack does NOT run its own Authentik — Cerulean's shared
  # Authentik (containers cerulean-authentik*) is the IdP, published on host
  # ports 9000 (HTTP) / 9443 (HTTPS) and proxied by NPM at auth.<domain>.
  # The AUTHENTIK_* / OIDC env below points the Control Center (dashboard-api)
  # at that instance (issuer https://auth.<domain>/application/o/<client>).
  # The comment block below is retained from an earlier iteration that bundled
  # Authentik in this compose file; it is intentionally inert.




  # ── Storage & dashboard: Grist (single-binary, API-first, no SaaS) ────────
  grist:
    image: gristlabs/grist:latest
    container_name: grist
    restart: unless-stopped
    # Memory posture: dashboards are light; cap for node heap safety.
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      # 127.0.0.1 — n8n writes to Grist as `http://grist:8484` over
      # interview-net; the public door is grist.<domain> → grist-sso (14011).
      - "127.0.0.1:8484:8484"
    environment:
      # GRIST_DEFAULT_EMAIL = single-identity mode (no password): Grist attributes
      # every request to this address, so the REST API needs no Authorization
      # header. GRIST_IN_SERVICE skips the first-run Quick-setup/boot-key gate.
      GRIST_DEFAULT_EMAIL: "${GRIST_ADMIN_EMAIL:-admin@localhost}"
      GRIST_IN_SERVICE: "true"
      GRIST_SERVE_SAME_ORIGIN: "true"
    volumes:
      - grist_data:/persist   # Grist writes to /persist (GRIST_INST_DIR), not /persistent
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8484/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interview-net]

  # ── Observability: metrics-only — OTel Collector (span metrics) →
  # Prometheus → Grafana. The collector converts inbound OTLP spans into RED
  # histograms (calls + duration, dimensioned by span.name) and then DROPS the
  # spans: there is no trace or log store to run. That is what removes the
  # ClickHouse + Keeper + metastore + SigNoz cluster, which was measured here
  # holding ~400 KiB of telemetry while pinning ~125% CPU and 1.18 GiB RSS.
  # Every latency number the old SigNoz dashboard charted is still available as
  # a Prometheus metric — see grafana/dashboards/pipeline-latency.json. Config
  # lives in otel-collector-config.yaml and prometheus/. Grist is the sole
  # record store (NocoDB removed — see docs/legacy-dependencies.md).
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.161.0}
    container_name: otel-collector
    restart: unless-stopped
    # Memory posture: this collector only holds span→metric aggregation state
    # (bounded by the spanmetrics dimension set), so a small cap is real.
    mem_limit: 512m
    memswap_limit: 512m
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      # Host ports are env-driven because this box also runs the voice stack's
      # SigNoz collector, which already owns 4317/4318/8888/8889 on loopback.
      # .env remaps these so both collectors can run at once — and they have to
      # live in .env, never in data/.env.resolved, which is regenerated from
      # .env on every resolve and silently drops anything added to it (a
      # recreate then dies on `Bind for 127.0.0.1:4317 failed`).
      # In-stack consumers are unaffected either way: they dial by service name
      # (otel-collector:4318, otel-collector:8889 for prometheus' scrape).
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"   # OTLP gRPC — loopback only (dograh host mode → 127.0.0.1:4317)
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"   # OTLP HTTP — loopback only
      - "127.0.0.1:${OTEL_INTERNAL_METRICS_PORT:-8888}:8888"   # collector internal metrics — loopback only
      - "127.0.0.1:${OTEL_SPAN_METRICS_PORT:-8889}:8889"   # span metrics, in Prometheus format — loopback only
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - probe-bin:/probe:ro
    depends_on:
      healthprobe:
        condition: service_completed_successfully
    # Health is the collector's own `health_check` extension, the :13133
    # endpoint otel-collector-config.yaml names as this service's healthcheck
    # target. This image is distroless too (no shell, no wget), so the probe is
    # the static busybox `healthprobe` unpacks into `probe-bin` — the same
    # reason the SSO gateways above use it. A config the collector refuses to
    # load still exits 1 and surfaces as `Restarting`; this catches the other
    # half, where the process is up but its own health is failing, which
    # otherwise looked identical to healthy from outside.
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:13133/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [interview-net]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.3}
    container_name: prometheus
    restart: unless-stopped
    # Memory posture: metrics + a bounded TSDB WAL. Both retention knobs are
    # set (time AND size) so a busy week can't fill the disk before the window
    # rolls — the old ClickHouse had only a 2 GiB memory cap and grew freely.
    mem_limit: 1g
    memswap_limit: 1g
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:9090:9090"   # loopback only
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [interview-net]

  grafana:
    # 13.x has a provisioning regression that crash-loops on datasource
    # provisioning ("Datasource provisioning error: data source not found",
    # grafana/grafana#110740). Pinned until that is fixed.
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.6.0}
    container_name: grafana
    restart: unless-stopped
    # Memory posture: UI + dashboard rendering only; the store is Prometheus.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:-http://localhost:3301}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      # 3301 is deliberately the port the SigNoz UI held: the NPM proxy host,
      # the dashboard catalog and any firewall rule keep pointing at the same
      # number, and only the upstream behind it changed.
      # On THIS box, however, the voice stack's SigNoz UI is live on 3301, so
      # the host port is env-driven and GRAFANA_HTTP_PORT (in .env — see the note
      # on the collector's ports above) puts Grafana on 3302. The public door is
      # unchanged: grafana.<domain> → grafana-sso
      # (14012), which reaches grafana:3000 over the compose network.
      - "127.0.0.1:${GRAFANA_HTTP_PORT:-3301}:3000"   # loopback only; public door is grafana.<domain> → grafana-sso (14012)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [interview-net]

  # ── Cantus switch (the voice plane) ──────────────────────────────────────
  # Asterisk 22 + FreePBX 17 + AvantFax used to live here, with the pbx-portal
  # image on top. Cantus 1.0 is the switch now — the same protocol the rest of
  # the estate speaks — so this service replaces both: one UDP socket for
  # signalling *and* media, one HTTP port for control, ARI and the browser
  # softphone, and no SIP, no AMI, no RTP port range, no Webmin, no MariaDB.
  #
  # dograh is unchanged: it dials ARI on 8088 as user `dograh` with either
  # CANTUS_ARI_PASSWORD or DOGRAH_ARI_PASSWORD, and cantus-switch serves
  # /ari/* so its existing scripts, tests and telephony configuration keep
  # working. See pbx/README.md.
  #
  # CAPSTONE_PBX=zeus (add-on mode) still means "someone else owns the switch":
  # point DOGRAH_ARI_HOST/PORT at that switch and leave this service down.
  cantus-switch:
    build:
      context: ../cantus-switch
    image: ${CANTUS_SWITCH_IMAGE:-capstone/cantus-switch:local}
    container_name: capstone-cantus
    restart: unless-stopped
    profiles: ["standalone"]
    environment:
      CANTUS_DOMAIN: ${CANTUS_DOMAIN:-capstone.local}
      CANTUS_ID: ${CANTUS_ID:-switch@capstone.local}
      CANTUS_SECRET: ${CANTUS_SECRET:-}
      CANTUS_CONTROL_TOKEN: ${CANTUS_CONTROL_TOKEN:-}
      CANTUS_ROUTES_FILE: /etc/cantus/routes.json
      CANTUS_HTTP_PORT: "8088"
      CANTUS_BIND: "0.0.0.0:7443"
      CANTUS_RELAY_BIND: "0.0.0.0:7444"
      # Dials out to dograh for externalMedia; host-mode dograh listens on the
      # host's own 8000, which is what host.docker.internal resolves to here.
      CANTUS_RELAY_ADVERTISE: ${CANTUS_RELAY_ADVERTISE:-}
      CANTUS_RECORD_DIR: /data/recordings
      CANTUS_PROMPTS: /data/prompts
      CANTUS_ARI_USER: ${CANTUS_ARI_USER:-dograh}
      CANTUS_ARI_PASSWORD: ${CANTUS_ARI_PASSWORD:-${DOGRAH_ARI_PASSWORD:-}}
      CANTUS_ARI_APP: ${DOGRAH_STASIS_APP_NAME:-dograh}
    ports:
      # 8088 is dialled at the host LAN IP and nothing else — dograh's ARI
      # telephony config points there (ansible/group_vars/all.yml), as do the
      # edge proxy and LAN clients. The softphone socket is on this port too,
      # so the browser console and the agent share one origin.
      - "${PJSIP_MEDIA_ADDRESS:-192.168.1.30}:8088:8088"
      # Cantus signalling and media, then the relay. Two ports replace
      # 5060/udp, 5061/tcp, 8089/tcp, 5038/tcp and 10101-10120/udp.
      - "7443:7443/udp"
      - "7444:7444/udp"
    volumes:
      - ./pbx/cantus:/etc/cantus:ro
      - cantus-recordings:/data/recordings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8088/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [interview-net]

  # ── Capstone Control Center (dashboard-api + dashboard) ────────────────
  # dashboard-api aggregates live stack state (Docker containers/health/
  # ports, the .env secret inventory, host users, whole-host resource stats)
  # into the JSON the SPA expects. dashboard serves the built React app and
  # reverse-proxies /api to it, keeping the browser same-origin.
  dashboard-api:
    build:
      context: ./dashboard-backend
      dockerfile: Dockerfile
    image: ${DASHBOARD_API_IMAGE:-capstone-dashboard-api:local}
    pull_policy: missing
    container_name: dashboard-api
    restart: unless-stopped
    ports:
      - "8095:8095"   # 0.0.0.0 — optional direct browser access to the API
    environment:
      SELF_CONTAINER: "dashboard-api"
      # Reachable host used to build resource-link URLs (LAN IP / hostname).
      # Normalised by the API (scheme/port/path stripped). The dashboard has
      # its own public URL (e.g. https://dashboard.<NPM_BASE_DOMAIN>) — do NOT
      # reuse PUBLIC_BASE_URL, which is dograh's advertised origin.
      DASHBOARD_HOST: "${DASHBOARD_PUBLIC_URL:-${PUBLIC_BASE_URL:-http://localhost:8000}}"
      # Public base domain for NPM-proxied services (e.g. capstone.innotel.us
      # → app/api/auth/voice/admin/pbx.capstone.innotel.us, …). Empty when
      # unset → links fall back to http://<host>:<port>.
      NPM_BASE_DOMAIN: "${NPM_BASE_DOMAIN:-}"
      DASHBOARD_ADMIN_EMAIL: "${GRIST_ADMIN_EMAIL:-}"
      # Interview reports page: read-only access to the Grist doc the n8n
      # grader writes to (same key setup.sh minted for the grader). Grist is
      # on the same interview-net bridge, so the service name resolves.
      GRIST_URL: "http://grist:8484"
      GRIST_DOC_ID: "${GRIST_DOC_ID:-}"
      GRIST_API_KEY: "${GRIST_API_KEY:-}"
      # Cerulean (Authentik) OIDC gate for the control center. When
      # AUTHENTIK_ISSUER_URL is set the API requires a Cerulean session on
      # every data endpoint; empty = open API (local dev / no auth stack).
      #
      # These are the dashboard's OWN Authentik application "Capstone Dashboard"
      # (slug/client_id ``capstone-dashboard``), NOT the bare AUTHENTIK_* vars
      # above — those are dograh's, and signing in with them bounces the browser
      # to the voice app (Authentik's Dograh provider only allows its own
      # callback). Empty = the dashboard falls back to an open API, so set all
      # three whenever the stack has an auth stack.
      AUTHENTIK_ISSUER_URL: "${DASHBOARD_AUTHENTIK_ISSUER_URL:-}"
      AUTHENTIK_CLIENT_ID: "${DASHBOARD_AUTHENTIK_CLIENT_ID:-}"
      AUTHENTIK_CLIENT_SECRET: "${DASHBOARD_AUTHENTIK_CLIENT_SECRET:-}"
      # The dashboard's OWN callback — the single redirect_uri registered on
      # that provider. AUTHENTIK_REDIRECT_URI is dograh's
      # (…/api/v1/auth/oidc/callback) and must not reach this container. When
      # unset the API derives https://dashboard.<NPM_BASE_DOMAIN>/api/auth/callback.
      DASHBOARD_AUTHENTIK_REDIRECT_URI: "${DASHBOARD_AUTHENTIK_REDIRECT_URI:-}"
      AUTHENTIK_ADMIN_EMAILS: "${AUTHENTIK_ADMIN_EMAILS:-}"
      # Health page → "Stack SSO & access" panel: reads the stack/user access
      # inventory from Authentik (which applications are gated by a group
      # binding, and which user can reach which stack). Needs an admin token —
      # scripts/authentik_bootstrap.py already uses the same one. The token
      # stays server-side; the browser only ever sees the aggregated result.
      AUTHENTIK_TOKEN: "${AUTHENTIK_TOKEN:-}"
      AUTHENTIK_PUBLIC_URL: "${AUTHENTIK_PUBLIC_URL:-}"
      # Optional direct IdP address for the API (defaults to the public URL),
      # and an opt-out for self-signed certs on that direct address.
      AUTHENTIK_API_URL: "${AUTHENTIK_API_URL:-}"
      AUTHENTIK_API_INSECURE: "${AUTHENTIK_API_INSECURE:-}"
      CERULEAN_TENANT: "${CERULEAN_TENANT:-}"
      # Dograh voice-agent management (Agents page): dograh-api runs in host
      # mode, so the dashboard reaches it via host.docker.internal. Token is
      # minted by scripts/dograh_wire.py; empty = page shows setup guidance.
      DOGRAH_API_ENDPOINT: "http://host.docker.internal:8000"
      DOGRAH_API_TOKEN: "${DOGRAH_API_TOKEN:-}"
      DOGRAH_CONFIG_NAME: "${DOGRAH_CONFIG_NAME:-Cantus ARI (dograh)}"
      # ARI app dograh registers with the switch (dograh_<hex>, or plain
      # `dograh`). The routing document names it in a DID route's `ari`
      # action; a document naming an app no ARI client registered is refused
      # at load time instead of dying silently on the first call.
      # scripts/dograh_wire.py persists it when it wires the telephony config.
      DOGRAH_STASIS_APP_NAME: "${DOGRAH_STASIS_APP_NAME:-}"
      # "Describe it with AI" workflow authoring on the Workflows page / agent
      # modal: the same route the Workflow Studio uses, through the SSO proxy
      # (20128) rather than the gateway's own port (20128, loopback + docker0
      # only — see the ports block under `omniroute`). Empty key is fine.
      OMNIROUTE_URL: "${OMNIROUTE_URL:-http://192.168.1.71:20128}"
      OMNIROUTE_API_KEY: "${OMNIROUTE_API_KEY:-}"
      OMNIROUTE_MODEL: "${OMNIROUTE_MODEL:-auto}"
      # addon (default): the switch owns its own lines and routing, so the
      # dashboard manages dograh only. standalone used to mean "write FreePBX
      # rows with docker exec"; there is no FreePBX to write to. Extension
      # provisioning is `POST /v1/lines` on the switch — see pbx/README.md.
      # Kept because older hosts still set it in .env.
      CAPSTONE_DEPLOY_MODE: "${CAPSTONE_DEPLOY_MODE:-addon}"
      # Provider (Zeus) vs local (OpenSMS) SMS for agents and scripts. The
      # Settings card writes this file; scripts/opensms_client.py reads the same
      # host path through the ./data/capstone mount below. `.env` seeds it.
      CAPSTONE_SMS_TRANSPORT_STATE: "/state/sms-transport"
      # Inbound SMS from the phone node. Empty = the /sms-inbound route is
      # closed (503), so an unset secret can never mean "open".
      CAPSTONE_SMS_INBOUND_TOKEN: "${CAPSTONE_SMS_INBOUND_TOKEN:-}"
      CAPSTONE_SMS_INBOUND_STATE: "/state/sms-inbound.jsonl"
      # Switch self-healing. cantus-switch is profile-gated the way the PBX it
      # replaced was, so a profile-less `docker compose up -d` stops it; the API
      # starts it on the next switch action and the watchdog recovers it
      # otherwise. Seconds; PBX_WATCHDOG_INTERVAL=0 disables the watchdog.
      PBX_START_WAIT_S: "${PBX_START_WAIT_S:-60}"
      PBX_WATCHDOG_INTERVAL: "${PBX_WATCHDOG_INTERVAL:-60}"
      # A reload is a document POST to the switch, so there is no lock file to
      # collide with. The values are kept because the API still reads them.
      # Seconds; PBX_RELOAD_MAX_WAIT=0 fails fast instead.
      PBX_RELOAD_MAX_WAIT: "${PBX_RELOAD_MAX_WAIT:-60}"
      PBX_RELOAD_POLL: "${PBX_RELOAD_POLL:-2}"
      # Keep the docker-derived /health, /services and /stats caches warm so a
      # request never pays the cold `docker stats` walk. Seconds; 0 disables.
      DASHBOARD_CACHE_WARM_INTERVAL: "${DASHBOARD_CACHE_WARM_INTERVAL:-5}"
      # Shared Magnate storefront for entitlement checks (RevenueOps);
      # empty when running standalone (no billing).
      MAGNATE_PUBLIC_URL: "${MAGNATE_PUBLIC_URL:-}"
      # Compose project(s) this control center reports on (comma-separated).
      # Defaults to this stack's own project so other projects on the same
      # Docker host never leak in.
      DASHBOARD_PROJECTS: "${DASHBOARD_PROJECTS:-capstone-voice-aiagent-platform}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/config/.env:ro
      - /etc/passwd:/etc/host-passwd:ro
      - /etc/group:/etc/host-groupfile:ro
      - /:/host:ro   # whole-host proc/disk for /metrics + /snapshot
      # The saved SMS transport. Host-side scripts read the same file at
      # data/capstone/sms-transport, so the Settings card reaches the dograh
      # tool and send_sms.py without a container recreate.
      - ./data/capstone:/state
    extra_hosts:
      # dograh-api is host-mode — resolve its host address from the bridge
      # (used by the Agents page / DOGRAH_API_ENDPOINT above).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8095/healthz', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [interview-net]

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: ${DASHBOARD_IMAGE:-capstone-dashboard:local}
    pull_policy: missing
    container_name: dashboard
    restart: unless-stopped
    environment:
      # Which host the softphone socket is proxied to (dashboard/nginx.conf).
      # The switch serves it on its control port, /ws/line, over plain ws:
      # there is no self-signed listener and no certificate to bypass.
      DASHBOARD_PBX_WSS_HOST: "${DASHBOARD_PBX_WSS_HOST:-capstone-cantus}"
    depends_on:
      dashboard-api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    ports:
      - "8096:80"   # the Control Center: http://<host>:8096
    # interview-net only: DASHBOARD_PBX_WSS_HOST names the switch from *this*
    # container's networks (Docker's embedded DNS only answers for names on a
    # network the querier shares), and the switch is on that bridge.
    networks: [interview-net]

  ###############################################
  # SSO gateways — one per app that has no OIDC of its own
  ###############################################
  # Each listens on 4180 inside the stack and is published on a distinct host
  # port; scripts/npm-proxy-hosts.py forwards the matching proxy host there.
  n8n-sso:
    <<: *sso-gateway
    container_name: n8n-sso
    environment:
      <<: *sso-gateway-env
      # n8n's whole point is receiving webhooks from outside, so those paths are
      # exempted from the login; /healthz is liveness. The editor and the REST API
      # stay gated.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: '^/webhook/,^/webhook-test/,^/healthz$'
      OAUTH2_PROXY_UPSTREAMS: http://n8n:5678
    ports:
      - "${N8N_SSO_PORT:-14010}:4180"
    networks: [interview-net]

  grist-sso:
    <<: *sso-gateway
    container_name: grist-sso
    environment:
      <<: *sso-gateway-env
      # NOTHING is skipped here on purpose. Grist runs in single-identity mode
      # (GRIST_DEFAULT_EMAIL), so its /api is effectively unauthenticated —
      # exempting it would publish the dashboards to the internet. n8n writes to
      # Grist over the compose network by container name, so it needs no edge
      # route.
      OAUTH2_PROXY_UPSTREAMS: http://grist:8484
    ports:
      - "${GRIST_SSO_PORT:-14011}:4180"
    networks: [interview-net]

  grafana-sso:
    <<: *sso-gateway
    container_name: grafana-sso
    environment:
      <<: *sso-gateway-env
      # Liveness only. OTLP arrives at the collector's own ports, not here.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: '^/api/health$'
      OAUTH2_PROXY_UPSTREAMS: http://grafana:3000
    ports:
      - "${GRAFANA_SSO_PORT:-14012}:4180"
    networks: [interview-net]

  workflow-sso:
    <<: *sso-gateway
    container_name: workflow-sso
    environment:
      <<: *sso-gateway-env
      OAUTH2_PROXY_UPSTREAMS: http://workflow-studio:8090
    ports:
      - "${WORKFLOW_SSO_PORT:-14013}:4180"
    networks: [interview-net]

  # ── Technitium's console is not gated from here ───────────────────────────
  # `technitium-sso` used to be the sixth gateway in this stack. That was right
  # only while every product shared one host: Cerulean owns the container
  # (`dns.internal.innotel.us` → `cerulean-technitium`), and the console is
  # host-networked with its web listener pinned to `127.0.0.1,172.17.0.1`, so a
  # gateway on *another* server has nothing to dial. The gateway now runs beside
  # the console it fronts, in the cerulean stack, on the same shared client,
  # cookie and session store — one Authentik session across the platform.

volumes:
  # Probe tools for the distroless services — populated by the `healthprobe`
  # one-shot, mounted read-only at /probe by the SSO gateways and
  # otel-collector.
  probe-bin:
  postgres_data:
  redis_data:
  # The media store: interview recordings and transcripts, which the edge serves
  # from /voice-audio. External with a fixed name so `docker compose down -v`
  # cannot delete it — this volume predates the compose project and carries no
  # labels ("volume \"capstone_minio-data\" already exists but was not created by
  # Docker Compose"), so as a plain key compose would consider it its own and
  # remove it along with the recordings. Same pattern as the pbx-* volumes below.
  minio-data:
    name: capstone_minio-data
    external: true
  # The gateway's own volume lives with the gateway now — `innotel-gateway_omniroute-data`
  # on i1 `.71`, declared by `ips/extensions/llm/docker-compose.host.yml`. This name
  # still exists on the host that ran the gateway before 2026-09-28 (`.46` keeps its
  # copy as the rollback), so it stays declared rather than deleted, and nothing
  # mounts it.
  omniroute_data:
  speaches_models:
  n8n_data:
  grist_data:
  prometheus_data:
  grafana_data:
  tts_shim_cache:
  tts_piper_voices:
  sandbox-tls:
  # The switch's recordings. Everything the old PBX kept in volumes (dialplan,
  # sounds, spool, logs, MariaDB, the portal's data) has no equivalent: routing
  # is a document in pbx/cantus/ and audio is one directory.
  cantus-recordings:
    name: capstone-cantus-recordings

networks:
  # Pinned name (not the project-prefixed default) so the stack lands on the
  # same bridge for all services (grist, grafana, tts-shim, pbx). Without `name:`,
  # compose creates a second `capstone_interview-net` and n8n can't reach
  # minio/grist. setup.sh pre-creates it on a fresh host, so it is `external`
  # here: compose must reuse the existing network instead of demanding its own
  # labels on it (which fails when setup.sh's bare `docker network create`
  # beat compose to it, e.g. on a wiped host).
  interview-net:
    name: interview-net
    external: true
