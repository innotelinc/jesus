# ═══════════════════════════════════════════════════════════════════════════
# Capstone — OPTIONAL build-from-source override for dograh api + ui
#
# By default the stack runs the prebuilt ghcr.io/innotelinc/dograh-api and
# ghcr.io/innotelinc/dograh-ui images. Use this file to build BOTH the api
# and ui from the dograh source (cloned by ./scripts/setup.sh into
# dograh/upstream) when those images aren't published yet.
#
# One-time preparation (the api image build needs the pipecat submodule and
# takes 15-25 minutes; the ui build needs npm and also takes a while):
#
#   git -C dograh/upstream submodule update --init --recursive
#   ./scripts/apply-dograh-patches.sh    # this repo's fixes to dograh
#
# That second step matters: dograh/upstream is gitignored, so the fixes this
# repo makes to the dograh UI (OIDC session handling, the workflow pages) live
# in dograh/patches/ and are applied here. scripts/setup.sh does it
# automatically; a bare build-from-source does not.
#
# On a memory-constrained host the UI build can be capped instead of being
# OOM-killed (Next's webpack pass and its type-check are run sequentially):
#
#   docker compose -f docker-compose.yml -f docker-compose.dograh-build.yml \
#     build --build-arg NODE_BUILD_HEAP_MB=3072 dograh-ui
#
# Build + start dograh-api and dograh-ui from that source (the rest of the
# stack is unaffected — keep using docker-compose.yml):
#
#   docker compose -f docker-compose.yml -f docker-compose.dograh-build.yml \
#     up -d --build dograh-api dograh-ui
#
# While this override file is on the compose command, the locally built images
# (tagged dograh-local/dograh-api:capstone / dograh-local/dograh-ui:capstone)
# replace the pulled images.
# ═══════════════════════════════════════════════════════════════════════════

services:
  dograh-api:
    build:
      context: ./dograh/upstream
      dockerfile: api/Dockerfile
    image: dograh-local/dograh-api:capstone
    pull_policy: build

  dograh-ui:
    build:
      context: ./dograh/upstream
      dockerfile: ui/Dockerfile
    image: dograh-local/dograh-ui:capstone
    pull_policy: build
