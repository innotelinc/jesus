# ── Prometheus: the metrics store for this stack ─────────────────────────────
# Replaces ClickHouse. Everything scraped here is small and bounded: the
# collector's span metrics, the TTS shim's own latency/cache counters, and
# Prometheus itself. Retention is enforced by the compose command line
# (PROMETHEUS_RETENTION / PROMETHEUS_RETENTION_SIZE).
#
# Scrape targets are addressed by compose service name on `interview-net`;
# nothing here dials the LAN (see README → Addressing).
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    stack: capstone

scrape_configs:
  # Span → metric output: traces.span.metrics.{calls,duration} for the
  # pipeline's llm-*/tts/stt/turn-N/conversation spans.
  - job_name: otel-collector-spanmetrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own internals (queue depth, dropped spans, exporter health).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # TTS shim: tts_shim_ttfa_seconds (per engine), request counts, cache hits.
  - job_name: tts-shim
    static_configs:
      - targets: ["tts-shim:8880"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
