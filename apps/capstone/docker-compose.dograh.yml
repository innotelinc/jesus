# ═══════════════════════════════════════════════════════════════════════════
# Capstone — dograh-api only (hybrid-box standalone)
#
# For deployments where redis, minio, and the LLM gateway (9Router / OmniRoute)
# run as HOST processes (e.g. systemd units: redis.service,
# aiplatform-minio.service, aiplatform-9router.service) instead of containers:
#
#   docker compose -f docker-compose.dograh.yml \
#     --env-file /path/to/interview-stack/.env up -d
#
# dograh-api runs in HOST network mode and reaches those services on loopback
# (127.0.0.1:6379 redis, 127.0.0.1:9000 minio, 127.0.0.1:20128 gateway) — the
# exact same URLs the full docker-compose.yml uses, so per-org model config in
# the dograh UI is identical either way.
#
# Why this file exists: the main compose declares redis/minio as containers
# that publish 6379/9000 — on a box where host processes already own those
# ports, `docker compose up -d dograh-api` fails on port allocation. This
# file lets you run ONLY dograh-api against the host services.
# ═══════════════════════════════════════════════════════════════════════════

services:
  dograh-api:
    image: ${DOGRAH_API_IMAGE:-dograhai/dograh-api:latest}
    container_name: dograh-api
    network_mode: host
    restart: unless-stopped
    environment:
      ENVIRONMENT: "local"
      DEPLOYMENT_MODE: "oss"
      LOG_LEVEL: "INFO"
      OSS_JWT_SECRET: "${OSS_JWT_SECRET:?set OSS_JWT_SECRET in .env}"

      # Must be reachable from INSIDE the n8n container (transcript fetch):
      # host LAN IP or public URL, NOT localhost.
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      BACKEND_API_ENDPOINT: "${BACKEND_API_ENDPOINT:-http://localhost:8000}"

      # Host-process services (redis / minio / LLM gateway on loopback)
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@127.0.0.1:5432/postgres"
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redissecret}@127.0.0.1:6379"
      MINIO_ENDPOINT: "127.0.0.1:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      MINIO_BUCKET: "voice-audio"
      MINIO_SECURE: "false"

      # ARI is configured per-organization in the dograh UI (ari_endpoint etc.)
      ENABLE_ARI_MANAGER: "true"
      ENABLE_ARI_STASIS: "true"
      ENABLE_CAMPAIGN_ORCHESTRATOR: "false"

      # ── OpenTelemetry → SigNoz ────────────────────────────────────────────
      OTEL_SERVICE_NAME: "dograh-interview-agent"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://127.0.0.1:4318"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      SIGNOZ_OTLP_ENDPOINT: "http://127.0.0.1:4318/v1/traces"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

networks: {}
