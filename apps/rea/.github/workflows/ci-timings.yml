name: CI timings

on:
  workflow_run:
    workflows: [CI, Release]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Report completed workflow attempt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Completed PR runs can contain untrusted changes. Execute only the
      # reporter from the trusted default branch; consume jobs as API data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Record queue, execution, and matched step timing
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TIMING_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_TIMING_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: node scripts/ci/job-timings.mjs
      - name: Upload CI timing artifacts
        if: always() && hashFiles('.cache/ci-job-timings/*') != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-job-timings
          path: .cache/ci-job-timings/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14
