; Dialplan for a fax machine with two modems.
;
; fax0 and fax1 are the contexts the modems dial *into*: a modem that has been
; told ATDT<number> places an IAX2 call with <number> as the destination, and
; the only thing that can answer it is the other modem. That is the whole
; loopback, and it is exactly how a page reaches a real destination too — the
; difference is only which peer the call is handed to.
;
; fax-in is where a carrier call for the fax DID lands (see pjsip.conf). The
; modem answers, HylaFAX negotiates, the page is written to recvq.
[general]
static=yes
writeprotect=yes
autofallthrough=yes
clearglobalvars=no
userscontext=default

[globals]
; Where a modem's outbound call is handed: the sibling modem in the loopback
; rig, the carrier once the estate supplies a sub-account. The entrypoint
; renders these as `IAX2/iax1` and `IAX2/iax0`, or `IAX2/carrier` for both —
; so the dialplan has one shape and the environment decides who answers.
OUTBOUND0=__OUTBOUND0__
OUTBOUND1=__OUTBOUND1__

[fax0]
exten => _X.,1,NoOp(fax0 dialling ${EXTEN})
 same => n,Set(CALLERID(num)=__NUMBER0__)
 same => n,Dial(${OUTBOUND0}/${EXTEN},120,tT)
 same => n,Hangup()

[fax1]
exten => _X.,1,NoOp(fax1 dialling ${EXTEN})
 same => n,Set(CALLERID(num)=__NUMBER1__)
 same => n,Dial(${OUTBOUND1}/${EXTEN},120,tT)
 same => n,Hangup()

; A carrier call. The first modem answers it; if it is busy the second one does.
[fax-in]
exten => _X.,1,NoOp(inbound fax from ${CALLERID(num)} to ${EXTEN})
 same => n,Set(FAX_DID=${EXTEN})
 same => n,Dial(IAX2/iax0,120)
 same => n,Dial(IAX2/iax1,120)
 same => n,Hangup()

[default]
exten => _X.,1,Congestion()
