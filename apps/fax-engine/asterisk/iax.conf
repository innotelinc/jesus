; The IAX2 server, and only that.
;
; Asterisk here is a switchboard for two local peers. It is not the fax machine
; and res_fax is not loaded: the modem is iaxmodem, the pages are HylaFAX's, and
; all Asterisk does is hand IAX2 frames between the two modems (and, when a SIP
; trunk is configured, between a carrier and a modem).
[general]
bindport=4569
; Loopback only. The modem path never leaves the container, and an IAX2 listener
; on a public interface would be an unauthenticated door onto the switchboard.
bindaddr=127.0.0.1
delayreject=yes
; Asterisk 20+ requires a call token before it will accept a call from a peer,
; and iaxmodem's libiax2 predates that. Without this every registration and
; every call is rejected with "CallToken Support required" and the modem looks
; dead while its tty is perfectly healthy.
requirecalltoken=no
iaxcompat=no
nochecksums=no
; Calls are answered by dialplan or a registered peer; nothing here should
; auto-answer a stray call.
autokill=yes
language=en

[iax0]
type=friend
host=127.0.0.1
port=4570
secret=__FAX_SECRET__
context=fax0
requirecalltoken=no
qualify=yes
qualifyfreq=20
disallow=all
allow=slin
transfer=no
callerid="Telno fax 0" <__FAX_NUMBER__>

[iax1]
type=friend
host=127.0.0.1
port=4571
secret=__FAX_SECRET__
context=fax1
requirecalltoken=no
qualify=yes
qualifyfreq=20
disallow=all
allow=slin
transfer=no
callerid="Telno fax 1" <__FAX_NUMBER__>
