; One container, seven processes, and the order matters: Asterisk has to be
; listening before a modem can register, and the spool has to have a scheduler
; before a faxgetty can do anything with a ring.
;
; faxgetty stays in the foreground (Debian's init backgrounds it), so it is a
; supervised child. faxq daemonises itself, so it is started and then left
; alone: a clean exit is the normal case, not a crash.
[supervisord]
nodaemon=true
pidfile=/var/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=10
startsecs=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:iaxmodem0]
; iaxmodem resolves its argument relative to /etc/iaxmodem, so this is a name,
; not a path — a full path becomes /etc/iaxmodem//etc/iaxmodem/...
command=/usr/bin/iaxmodem ttyIAX0.conf
priority=20
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:iaxmodem1]
command=/usr/bin/iaxmodem ttyIAX1.conf
priority=21
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:faxq]
; -D is "do not fork": the scheduler stays a supervised child, so a dead
; scheduler is restarted instead of being mistaken for a clean daemon start.
command=/usr/sbin/faxq -D
priority=30
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:hfaxd]
; -d keeps it in the foreground and -i is required: without a port hfaxd
; configures no listener and exits. faxstat and the /jobs door talk to this.
command=/usr/sbin/hfaxd -q /var/spool/hylafax -d -i 4559
priority=31
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:faxgetty0]
command=/usr/sbin/faxgetty /dev/ttyIAX0
priority=40
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:faxgetty1]
command=/usr/sbin/faxgetty /dev/ttyIAX1
priority=41
startsecs=3
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:status]
command=/usr/bin/python3 /opt/fax/status.py
priority=50
startsecs=2
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
