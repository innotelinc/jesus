# Oasis Mail deployment (mail.innotel.us).
#
# Installed at /opt/bulwark/docker-compose.yml inside the `mail` Incus
# container. Secrets and deployment-specific values live in .env.local next to
# this file and are never committed; see .env.local.example for the keys.
#
# The image is built from the innotelinc/webmail fork and published privately
# to GHCR, so the host must be logged in (`docker login ghcr.io`) before
# `docker compose pull`. 1.17.0 carries the Oasis brand; the host may also load
# a locally built `oasis/webmail:1.17.0` with `docker load`.
services:
  bulwark:
    image: ${OASIS_MAIL_IMAGE:-ghcr.io/innotelinc/webmail:1.17.0-sso}
    container_name: bulwark
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      # Encrypted user settings (SETTINGS_DATA_DIR).
      - bulwark-settings:/app/data/settings
      # Admin configuration: config.json, policy.json, admin.json, plugins,
      # themes, branding uploads (ADMIN_CONFIG_DIR).
      - bulwark-config:/app/data/admin
      # Admin runtime state: admin-state.json, audit.log, setup token.
      - bulwark-state:/app/data/admin-state
      # Anonymous telemetry: instance id, consent state, login HMACs.
      - bulwark-telemetry:/app/data/telemetry
    healthcheck:
      test: ["CMD","wget","--no-verbose","--tries=1","--spider","http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  bulwark-settings:
  bulwark-config:
  bulwark-state:
  bulwark-telemetry:
